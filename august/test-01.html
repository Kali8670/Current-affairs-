<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karnataka PC & SSC CBT Exam Mock Test</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f4f6f9; color: #333; }
        
        /* Top Navigation Bar */
        .top-bar {
            background-color: #1a237e;
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .timer { background-color: #e74c3c; padding: 5px 12px; border-radius: 4px; font-weight: bold; }
        
        /* Layout Grid */
        .main-container { display: flex; flex-direction: row; min-height: calc(100vh - 48px); }
        .quiz-section { flex: 1; padding: 25px; background-color: #fff; }
        .palette-section { width: 300px; background-color: #ebedf0; border-left: 1px solid #ccc; padding: 15px; text-align: center; }

        /* Quiz Question & Options */
        .q-header { margin-bottom: 20px; font-weight: bold; font-size: 17px; line-height: 1.5; color: #1a237e; }
        .options-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .option-btn {
            display: flex;
            align-items: center;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background-color: #f9fafb;
            cursor: pointer;
            text-align: left;
            font-size: 15px;
            transition: all 0.2s ease;
        }
        .option-btn:hover:not(:disabled) { background-color: #e8eaf6; border-color: #1a237e; }
        
        /* Options Feedback Styling */
        .option-btn.correct { 
            background-color: #d1fae5 !important; 
            border-color: #10b981 !important; 
            color: #065f46 !important; 
            font-weight: bold;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }
        .option-btn.incorrect { 
            background-color: #fee2e2 !important; 
            border-color: #ef4444 !important; 
            color: #991b1b !important;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }

        /* Feedback Box */
        .explanation-box {
            display: none;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.5;
        }
        .explanation-box.wrong { background-color: #fee2e2; border: 1px solid #ef4444; color: #991b1b; }
        .explanation-box.right { background-color: #d1fae5; border: 1px solid #10b981; color: #065f46; }

        /* Navigation Controls */
        .controls { display: flex; gap: 10px; justify-content: space-between; margin-top: 25px; border-top: 1px solid #eee; padding-top: 20px; flex-wrap: wrap; }
        .action-btn { padding: 10px 18px; border: none; border-radius: 5px; background-color: #1a237e; color: white; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
        .action-btn:disabled { background-color: #ccc; cursor: not-allowed; box-shadow: none !important; }
        
        /* Special Glowing Action Buttons */
        .retest-btn { 
            background-color: #4CAF50 !important; 
            color: white; 
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.7);
        }
        .retest-btn:hover { background-color: #43a047 !important; }

        .wrong-test-btn { 
            background-color: #f44336 !important; 
            color: white; 
            box-shadow: 0 0 10px rgba(244, 67, 54, 0.7);
        }
        .wrong-test-btn:hover { background-color: #e53935 !important; }

        /* Question Palette Right Sidebar */
        .palette-title { font-size: 15px; font-weight: bold; margin-bottom: 10px; color: #1a237e; }
        .score-board { margin-bottom: 15px; font-size: 14px; font-weight: bold; color: #374151; }
        .palette-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-height: 70vh; overflow-y: auto; padding-right: 5px; }
        .p-btn { padding: 10px 5px; border: 1px solid #ccc; background-color: white; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.2s; }
        .p-btn.active { border: 2px solid #1a237e; background-color: #e8eaf6; }
        
        /* Palette Feedback Colors */
        .p-btn.answered-correct { 
            background-color: #10b981 !important; 
            color: white; 
            border-color: #10b981; 
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.8);
        }
        .p-btn.answered-wrong { 
            background-color: #ef4444 !important; 
            color: white; 
            border-color: #ef4444; 
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.8);
        }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .palette-section { width: 100%; border-left: none; border-top: 1px solid #ccc; }
            .palette-grid { grid-template-columns: repeat(6, 1fr); }
            .controls { justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div id="test-title">Karnataka PC & SSC CBT Exam Mock Test</div>
        <div class="timer">Time Remaining: <span id="timer-display">120:00</span></div>
    </div>

    <div class="main-container">
        <div class="quiz-section">
            <div id="quiz-body">
                <div class="q-header" id="question-text">Loading question...</div>
                <div class="options-container" id="options-container"></div>
                <div class="explanation-box" id="explanation-box"></div>
            </div>
            <div class="controls">
                <button class="action-btn" id="prev-btn" onclick="changeQuestion(-1)">Previous</button>
                <button class="action-btn retest-btn" onclick="resetQuiz()">ಮರುಪರೀಕ್ಷೆ (Retest All)</button>
                <button class="action-btn wrong-test-btn" onclick="startWrongTest()">Test Wrong Answers</button>
                <button class="action-btn" id="next-btn" onclick="changeQuestion(1)">Next</button>
            </div>
        </div>

        <div class="palette-section">
            <div class="palette-title">Question Palette</div>
            <div class="score-board">Score: <span id="current-score">0</span> / <span id="total-q-count">0</span></div>
            <div class="palette-grid" id="palette-grid"></div>
        </div>
    </div>

<script>
// Raw Question Database
const rawQuestions = [
    { q: "ಮಿಷನ್ ಆಗಮನ ದೇಶದ ಮೊದಲ ಖಾಸಗಿ ರಾಕೆಟ್ ಯಾವುದು?", options: ["ವಿಕ್ರಂ-ಎಸ್ (Vikram-S)", "ಪಿಎಸ್‌ಎಲ್‌ವಿ", "ಜಿಎಸ್‌ಎಲ್‌ವಿ", "ಅಗ್ನಿ-5"], answer: 0, exp: "ಮಿಷನ್ ಆಗಮನ ಯೋಜನೆ ಅಡಿಯಲ್ಲಿ ಸ್ಕೈರೂಟ್ ಏರೋಸ್ಪೇಸ್ ಸಂಸ್ಥೆಯು ದೇಶದ ಮೊದಲ ಖಾಸಗಿ ರಾಕೆಟ್ 'ವಿಕ್ರಂ-ಎಸ್' ಅನ್ನು ಉಡಾವಣೆ ಮಾಡಿದೆ." },
    { q: "ವಿಕ್ರಂ ಒನ್ (Vikram-1) ರಾಕೆಟ್ ಅನ್ನು ಯಾವುದಕ್ಕಾಗಿ ಉಡಾವಣೆ ಮಾಡಲಾಗಿದೆ?", options: ["ಪೆಲೋಡ್‌ಗಳನ್ನು ಕಕ್ಷೆಗೆ ಕಳುಹಿಸಲು", "ಚಂದ್ರಯಾನಕ್ಕಾಗಿ", "ಸೂರ್ಯನ ಅಧ್ಯಯನಕ್ಕೆ", "ಸಮುದ್ರ ಸಂಶೋಧನೆಗೆ"], answer: 0, exp: "ಖಾಸಗಿ ಸಂಸ್ಥೆಯ ರಾಕೆಟ್ ಬಳಸಿ ಪೇಲೋಡ್‌ಗಳನ್ನು ಕಕ್ಷೆಗೆ ಕಳುಹಿಸುವ ಪ್ರಯೋಗ ಇದಾಗಿದೆ." },
    { q: "ವಿಕ್ರಂ-1 ರಾಕೆಟ್ ಅನ್ನು ನಿರ್ಮಿಸಿದ ಸಂಸ್ಥೆ ಯಾವುದು?", options: ["ಸ್ಕೈರೂಟ್ ಏರೋಸ್ಪೇಸ್ (ಹೈದರಾಬಾದ್)", "ಇಸ್ರೋ", "ಡಿಆರ್‌ಡಿಒ", "ಅಗ್ನಿಕುಲ್"], answer: 0, exp: "ಸ್ಕೈರೂಟ್ ಏರೋಸ್ಪೇಸ್ ಹೈದರಾಬಾದ್ ಮೂಲದ ಖಾಸಗಿ ಬಾಹ್ಯಾಕಾಶ ಸಂಸ್ಥೆಯಾಗಿದೆ." },
    { q: "ಖಾಸಗಿ ಸಂಸ್ಥೆಯ ರಾಕೆಟ್ ಬಳಸಿ ಪೇಲೋಡ್ ಕಳುಹಿಸುವ ಪ್ರಯೋಗದ ಹೆಸರು ಏನು?", options: ["ಮಿಷನ್ ಆಗಮನ", "ಮಿಷನ್ ಗಗನಯಾನ", "ಮಿಷನ್ ಶಕ್ತಿ", "ಮಿಷನ್ ಆದಿತ್ಯ"], answer: 0, exp: "ಖಾಸಗಿ ಸಂಸ್ಥೆಯ ರಾಕೆಟ್ ಬಳಸಿ ಪೇಲೋಡ್‌ಗಳನ್ನು ಕಕ್ಷೆಗೆ ಕಳುಹಿಸುವ ಪ್ರಯೋಗವನ್ನು ಮಿಷನ್ ಆಗಮನ ಎನ್ನಲಾಗುತ್ತದೆ." },
    { q: "ರಷ್ಯಾದ ಸುಯೆಜ್ MS-29 ನೌಕೆ ಮೂಲಕ ISS ತಲುಪಿ 2027ಕ್ಕೆ ಮರಳಲಿರುವ ಭಾರತೀಯ ಮೂಲದ ನಾಸಾ ಗಗನಯಾತ್ರಿ ಯಾರು?", options: ["ಅನಿಲ್ ಮೆನನ್", "ಶುಭಾಂಶು ಶುಕ್ಲ", "ರಾಕೇಶ್ ಶರ್ಮಾ", "ಸುನಿತಾ ವಿಲಿಯಮ್ಸ್"], answer: 0, exp: "ಅನಿಲ್ ಮೆನನ್ ಅವರು 8 ತಿಂಗಳು ಬಾಹ್ಯಾಕಾಶ ಕೇಂದ್ರದಲ್ಲಿದ್ದು ಅಧ್ಯಯನ ನಡೆಸಿ 2027ಕ್ಕೆ ಮರಳಲಿದ್ದಾರೆ." },
    { q: "ಇತ್ತೀಚೆಗೆ ಬಾಹ್ಯಾಕಾಶಯಾನಕ್ಕೆ ಆಯ್ಕೆಯಾದ ಭಾರತೀಯ ಗಗನಯಾನಿ ಯಾರು?", options: ["ಶುಭಾಂಶು ಶುಕ್ಲ", "ಅನಿಲ್ ಮೆನನ್", "ಪ್ರಶಾಂತ್ ಬಾಲಕೃಷ್ಣನ್", "ಅಂಗದ್ ಪ್ರತಾಪ್"], answer: 0, exp: "ಶುಭಾಂಶು ಶುಕ್ಲ ಇತ್ತೀಚೆಗೆ ಅಂತರರಾಷ್ಟ್ರೀಯ ಬಾಹ್ಯಾಕಾಶ ಕೇಂದ್ರಕ್ಕೆ ಪ್ರಯಾಣಿಸಲು ಆಯ್ಕೆಯಾದ ಗಗನಯಾನಿ." },
    { q: "ಚಂಡಮಾರುತದಿಂದಾಗಿ ಸಂಪರ್ಕ ಕಳೆದುಕೊಂಡು ಪ್ರಸ್ತುತ ಲೈನ್ನಲ್ಲಿ ಇಲ್ಲದಿರುವ ಉಪಗ್ರಹ ಮಿಷನ್ ಯಾವುದು?", options: ["ಆಪ್ಟು ಸ್ಟಾರ್ (Apstar)", "ಇನ್ಸಾಟ್", "ಕಾರ್ಟೋಸ್ಯಾಟ್", "ಆಸ್ಟ್ರೋಸ್ಯಾಟ್"], answer: 0, exp: "ಆಪ್ಟು ಸ್ಟಾರ್ ಉಪಗ್ರಹ ಮಿಷನ್ ದೃಷ್ಟಿಯಿಂದ ಚಂಡಮಾರುತದಿಂದ ಸಂಪರ್ಕವನ್ನು ಕಳೆದುಕೊಂಡಿದೆ." },
    { q: "2026ರ 23ನೇ ಆವೃತ್ತಿಯ ಫಿಫಾ (FIFA) ಚಾಂಪಿಯನ್ ತಂಡ ಯಾವುದು?", options: ["ಸ್ಪೇನ್", "ಅರ್ಜೆಂಟೀನಾ", "ಇಂಗ್ಲೆಂಡ್", "ಫ್ರಾನ್ಸ್"], answer: 0, exp: "23ನೇ ಆವೃತ್ತಿಯ ಫಿಫಾ 2026ರ ಚಾಂಪಿಯನ್ ಸ್ಪೇನ್ ಆಗಿದೆ." },
    { q: "2026ರ ಫಿಫಾ ಟೂರ್ನಿಯ ರನ್ನರ್-ಅಪ್ ತಂಡ ಯಾವುದು?", options: ["ಫ್ರಾನ್ಸ್ / ಅರ್ಜೆಂಟೀನಾ", "ಸ್ಪೇನ್", "ಇಂಗ್ಲೆಂಡ್", "ಜರ್ಮನಿ"], answer: 0, exp: "ಫಿಫಾ 2026ರ ಫೈನಲ್‌ನಲ್ಲಿ ಸ್ಪೇನ್ ವಿರುದ್ಧ ಸೋತು ರನ್ನರ್-ಅಪ್ ಆದ ತಂಡ." },
    { q: "2026ರ ಫಿಫಾ ವಿಶ್ವಕಪ್‌ನಲ್ಲಿ ಮೂರನೇ ಸ್ಥಾನ (Third Place) ಪಡೆದ ದೇಶ ಯಾವುದು?", options: ["ಇಂಗ್ಲೆಂಡ್", "ಸ್ಪೇನ್", "ಬ್ರೆಜಿಲ್", "ಕ್ರೊಯೇಷಿಯಾ"], answer: 0, exp: "ಫಿಫಾ 2026ರಲ್ಲಿ ಇಂಗ್ಲೆಂಡ್ ಮೂರನೇ ಸ್ಥಾನವನ್ನು ಗಳಿಸಿದೆ." }
];

// Dynamically generate extra dummy practice questions up to 191
while(rawQuestions.length < 191) {
    let index = rawQuestions.length + 1;
    rawQuestions.push({
        q: `ಪ್ರಶ್ನೆ ${index}: ಪ್ರಚಲಿತ ಘಟನೆಗಳು ಮತ್ತು ಸಂವಿಧಾನ ವಿಷಯದ ಅಭ್ಯಾಸ ಪ್ರಶ್ನೆ ${index}`,
        options: [`ಸರಿಯಾದ ಉತ್ತರ ${index}`, `ಆಯ್ಕೆ ಬಿ`, `ಆಯ್ಕೆ ಸಿ`, `ಆಯ್ಕೆ ಡಿ`],
        answer: 0,
        exp: `ಇದು ಪುನರಾವರ್ತಿತ ಪರೀಕ್ಷೆಗಾಗಿ ನೀಡಲಾದ ಅಭ್ಯಾಸ ಪ್ರಶ್ನೆ ${index} ರ ವಿವರಣೆಯಾಗಿದೆ.`
    });
}

// Master Dataset with Initial Jumbling of Options
let masterQuizData = rawQuestions.map((item, originalIndex) => {
    let indexedOptions = item.options.map((opt, idx) => ({ text: opt, isCorrect: idx === item.answer }));
    // Shuffle options array randomly
    indexedOptions.sort(() => Math.random() - 0.5);
    
    return {
        originalId: originalIndex + 1,
        q: item.q,
        options: indexedOptions.map(o => o.text),
        answer: indexedOptions.findIndex(o => o.isCorrect),
        exp: item.exp,
        userAnswer: null
    };
});

let activeQuestions = [...masterQuizData];
let currentIndex = 0;
let score = 0;
let wrongTestCount = 0;
const baseTitle = "Karnataka PC & SSC CBT Exam Mock Test";

function initPalette() {
    const grid = document.getElementById('palette-grid');
    grid.innerHTML = '';
    document.getElementById('total-q-count').innerText = activeQuestions.length;
    
    activeQuestions.forEach((qObj, idx) => {
        const btn = document.createElement('button');
        btn.className = 'p-btn';
        btn.id = `p-btn-${idx}`;
        btn.innerText = qObj.originalId; // Preserves global numbering
        btn.onclick = () => jumpToQuestion(idx);
        
        // Restore color states on palette rebuild
        if (qObj.userAnswer !== null) {
            if (qObj.userAnswer === qObj.answer) {
                btn.classList.add('answered-correct');
            } else {
                btn.classList.add('answered-wrong');
            }
        }
        grid.appendChild(btn);
    });
}

function loadQuestion() {
    const qData = activeQuestions[currentIndex];
    document.getElementById('question-text').innerText = `${qData.originalId}. ${qData.q}`;
    
    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    const expBox = document.getElementById('explanation-box');
    expBox.style.display = 'none';

    const labels = ['A', 'B', 'C', 'D'];

    qData.options.forEach((opt, optIdx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<b style="margin-right:8px;">${labels[optIdx]})</b> ${opt}`;
        
        if (qData.userAnswer !== null) {
            btn.disabled = true;
            if (optIdx === qData.answer) {
                btn.classList.add('correct');
            }
            if (qData.userAnswer === optIdx && optIdx !== qData.answer) {
                btn.classList.add('incorrect');
            }
        } else {
            btn.onclick = () => selectAnswer(optIdx);
        }
        
        optionsContainer.appendChild(btn);
    });

    if (qData.userAnswer !== null) {
        expBox.style.display = 'block';
        if (qData.userAnswer === qData.answer) {
            expBox.className = 'explanation-box right';
            expBox.innerHTML = `<b>ಸರಿ! (Correct)</b><br>${qData.exp}`;
        } else {
            expBox.className = 'explanation-box wrong';
            expBox.innerHTML = `<b>ತಪ್ಪು! (Incorrect)</b><br>ಸರಿಯಾದ ಉತ್ತರ: <b>${labels[qData.answer]}) ${qData.options[qData.answer]}</b><br>${qData.exp}`;
        }
    }

    document.getElementById('prev-btn').disabled = currentIndex === 0;
    document.getElementById('next-btn').disabled = currentIndex === activeQuestions.length - 1;

    updatePaletteHighlight();
}

function selectAnswer(optionIdx) {
    if (activeQuestions[currentIndex].userAnswer !== null) return;

    activeQuestions[currentIndex].userAnswer = optionIdx;
    const qData = activeQuestions[currentIndex];
    const pBtn = document.getElementById(`p-btn-${currentIndex}`);

    if (optionIdx === qData.answer) {
        score++;
        pBtn.classList.add('answered-correct');
    } else {
        pBtn.classList.add('answered-wrong');
    }

    document.getElementById('current-score').innerText = score;
    loadQuestion();
}

function updatePaletteHighlight() {
    activeQuestions.forEach((_, idx) => {
        const btn = document.getElementById(`p-btn-${idx}`);
        if (btn) {
            if (idx === currentIndex) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        }
    });
}

function changeQuestion(direction) {
    currentIndex += direction;
    loadQuestion();
}

function jumpToQuestion(index) {
    currentIndex = index;
    loadQuestion();
}

// Retest All (ಮರುಪರೀಕ್ಷೆ) Button Logic
function resetQuiz() {
    if (confirm("ನಿಮಗೆ ಈ ಟೆಸ್ಟ್ ಅನ್ನು ಮತ್ತೆ ಮೊದಲಿನಿಂದ ಆರಂಭಿಸಲು ಇಷ್ಟವಿದೆಯೇ? (Do you want to restart all questions?)")) {
        wrongTestCount = 0;
        document.getElementById('test-title').innerText = baseTitle;
        
        masterQuizData.forEach(q => q.userAnswer = null);
        activeQuestions = [...masterQuizData];
        score = 0;
        currentIndex = 0;
        
        document.getElementById('current-score').innerText = score;
        initPalette();
        loadQuestion();
    }
}

// Test Wrong Answers Button Logic
function startWrongTest() {
    const wrongQuestions = activeQuestions.filter(q => q.userAnswer !== null && q.userAnswer !== q.answer);
    
    if (wrongQuestions.length === 0) {
        alert("ಸದ್ಯಕ್ಕೆ ಯಾವುದೇ ತಪ್ಪು ಉತ್ತರಗಳಿಲ್ಲ! (No wrong answers found to re-test!)");
        return;
    }

    wrongTestCount++;
    document.getElementById('test-title').innerText = `${baseTitle} (Wrong Test-${wrongTestCount})`;
    
    // Reset user answers for the filtered wrong questions
    wrongQuestions.forEach(q => q.userAnswer = null);
    activeQuestions = wrongQuestions;
    
    score = 0;
    currentIndex = 0;
    document.getElementById('current-score').innerText = score;
    
    initPalette();
    loadQuestion();
}

// Timer Countdown Function
let totalSeconds = 120 * 60;
setInterval(() => {
    if (totalSeconds > 0) {
        totalSeconds--;
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        document.getElementById('timer-display').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
    }
}, 1000);

window.onload = () => {
    initPalette();
    loadQuestion();
};
</script>
</body>
</html>
