<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karnataka PC & SSC CBT Exam Mock Test</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; color: #333; }
        
        /* Top Navigation Bar */
        .top-bar {
            background-color: #0b3c6d;
            color: white;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
        }
        .timer { background-color: #e74c3c; padding: 4px 8px; border-radius: 4px; }
        
        /* Layout Grid */
        .main-container { display: flex; flex-direction: row; min-height: calc(100vh - 42px); }
        .quiz-section { flex: 1; padding: 20px; background-color: #fff; }
        .palette-section { width: 280px; background-color: #ebedf0; border-left: 1px solid #ccc; padding: 15px; text-align: center; }

        /* Quiz Question & Options */
        .q-header { margin-bottom: 15px; font-weight: bold; font-size: 16px; line-height: 1.4; }
        .options-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .option-btn {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background-color: #f9fafb;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            transition: 0.2s;
        }
        .option-btn:hover { background-color: #edf2f7; }
        .option-btn.correct { background-color: #d1fae5; border-color: #10b981; color: #065f46; font-weight: bold; }
        .option-btn.incorrect { background-color: #fee2e2; border-color: #ef4444; color: #991b1b; }

        /* Feedback Box */
        .explanation-box {
            display: none;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 13px;
            line-height: 1.4;
        }
        .explanation-box.wrong { background-color: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; }
        .explanation-box.right { background-color: #d1fae5; border: 1px solid #6ee7b7; color: #065f46; }

        /* Navigation Controls */
        .controls { display: flex; justify-content: space-between; margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px; }
        .action-btn { padding: 8px 16px; border: none; border-radius: 4px; background-color: #0b3c6d; color: white; cursor: pointer; font-weight: bold; }
        .action-btn:disabled { background-color: #ccc; cursor: not-allowed; }
        .retest-btn { background-color: #d97706; }

        /* Question Palette Right Sidebar */
        .palette-title { font-size: 14px; font-weight: bold; margin-bottom: 10px; color: #333; }
        .score-board { margin-bottom: 15px; font-size: 13px; font-weight: bold; color: #4b5563; }
        .palette-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-height: 70vh; overflow-y: auto; padding-right: 5px; }
        .p-btn { padding: 8px; border: 1px solid #ccc; background-color: white; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .p-btn.active { border: 2px solid #0b3c6d; font-weight: bold; }
        .p-btn.answered-correct { background-color: #10b981; color: white; border-color: #10b981; }
        .p-btn.answered-wrong { background-color: #ef4444; color: white; border-color: #ef4444; }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .palette-section { width: 100%; border-left: none; border-top: 1px solid #ccc; }
            .palette-grid { grid-template-columns: repeat(6, 1fr); }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div>Karnataka PC & SSC CBT Exam Mock Test</div>
        <div class="timer">Time Remaining: <span id="timer-display">120:00</span></div>
    </div>

    <div class="main-container">
        <div class="quiz-section">
            <div id="quiz-body">
                <div class="q-header" id="question-text">Loading question...</div>
                <div class="options-container" id="options-container"></div>
                <div class="explanation-box" id="explanation-box"></div>
            </div>
            <div class="controls">
                <button class="action-btn" id="prev-btn" onclick="changeQuestion(-1)">Previous</button>
                <button class="action-btn retest-btn" onclick="resetQuiz()">Retest / Re-attempt Test</button>
                <button class="action-btn" id="next-btn" onclick="changeQuestion(1)">Next</button>
            </div>
        </div>

        <div class="palette-section">
            <div class="palette-title">Question Palette</div>
            <div class="score-board">Score: <span id="current-score">0</span> / 191</div>
            <div class="palette-grid" id="palette-grid"></div>
        </div>
    </div>

<script>
const quizData = [
    { q: "ಮಿಷನ್ ಆಗಮನ ದೇಶದ ಮೊದಲ ಖಾಸಗಿ ರಾಕೆಟ್ ಯಾವುದು?", options: ["ವಿಕ್ರಂ-ಎಸ್ (Vikram-S)", "ಪಿಎಸ್‌ಎಲ್‌ವಿ", "ಜಿಎಸ್‌ಎಲ್‌ವಿ", "ಅಗ್ನಿ-5"], answer: 0, exp: "ಮಿಷನ್ ಆಗಮನ ಯೋಜನೆ ಅಡಿಯಲ್ಲಿ ಸ್ಕೈರೂಟ್ ಏರೋಸ್ಪೇಸ್ ಸಂಸ್ಥೆಯು ದೇಶದ ಮೊದಲ ಖಾಸಗಿ ರಾಕೆಟ್ 'ವಿಕ್ರಂ-ಎಸ್' ಅನ್ನು ಉಡಾವಣೆ ಮಾಡಿದೆ." },
    { q: "ವಿಕ್ರಂ ಒನ್ (Vikram-1) ರಾಕೆಟ್ ಅನ್ನು ಯಾವುದಕ್ಕಾಗಿ ಉಡಾವಣೆ ಮಾಡಲಾಗಿದೆ?", options: ["ಪೆಲೋಡ್‌ಗಳನ್ನು ಕಕ್ಷೆಗೆ ಕಳುಹಿಸಲು", "ಚಂದ್ರಯಾನಕ್ಕಾಗಿ", "ಸೂರ್ಯನ ಅಧ್ಯಯನಕ್ಕೆ", "ಸಮುದ್ರ ಸಂಶೋಧನೆಗೆ"], answer: 0, exp: "ಖಾಸಗಿ ಸಂಸ್ಥೆಯ ರಾಕೆಟ್ ಬಳಸಿ ಪೇಲೋಡ್‌ಗಳನ್ನು ಕಕ್ಷೆಗೆ ಕಳುಹಿಸುವ ಪ್ರಯೋಗ ಇದಾಗಿದೆ." },
    { q: "ವಿಕ್ರಂ-1 ರಾಕೆಟ್ ಅನ್ನು ನಿರ್ಮಿಸಿದ ಸಂಸ್ಥೆ ಯಾವುದು?", options: ["ಸ್ಕೈರೂಟ್ ಏರೋಸ್ಪೇಸ್ (ಹೈದರಾಬಾದ್)", "ಇಸ್ರೋ", "ಡಿಆರ್‌ಡಿಒ", "ಅಗ್ನಿಕುಲ್"], answer: 0, exp: "ಸ್ಕೈರೂಟ್ ಏರೋಸ್ಪೇಸ್ ಹೈದರಾಬಾದ್ ಮೂಲದ ಖಾಸಗಿ ಬಾಹ್ಯಾಕಾಶ ಸಂಸ್ಥೆಯಾಗಿದೆ." },
    { q: "ಖಾಸಗಿ ಸಂಸ್ಥೆಯ ರಾಕೆಟ್ ಬಳಸಿ ಪೇಲೋಡ್ ಕಳುಹಿಸುವ ಪ್ರಯೋಗದ ಹೆಸರು ಏನು?", options: ["ಮಿಷನ್ ಆಗಮನ", "ಮಿಷನ್ ಗಗನಯಾನ", "ಮಿಷನ್ ಶಕ್ತಿ", "ಮಿಷನ್ ಆದಿತ್ಯ"], answer: 0, exp: "ಖಾಸಗಿ ಸಂಸ್ಥೆಯ ರಾಕೆಟ್ ಬಳಸಿ ಪೇಲೋಡ್‌ಗಳನ್ನು ಕಕ್ಷೆಗೆ ಕಳುಹಿಸುವ ಪ್ರಯೋಗವನ್ನು ಮಿಷನ್ ಆಗಮನ ಎನ್ನಲಾಗುತ್ತದೆ." },
    { q: "ರಷ್ಯಾದ ಸುಯೆಜ್ MS-29 ನೌಕೆ ಮೂಲಕ ISS ತಲುಪಿ 2027ಕ್ಕೆ ಮರಳಲಿರುವ ಭಾರತೀಯ ಮೂಲದ ನಾಸಾ ಗಗನಯಾತ್ರಿ ಯಾರು?", options: ["ಅನಿಲ್ ಮೆನನ್", "ಶುಭಾಂಶು ಶುಕ್ಲ", "ರಾಕೇಶ್ ಶರ್ಮಾ", "ಸುನಿತಾ ವಿಲಿಯಮ್ಸ್"], answer: 0, exp: "ಅನಿಲ್ ಮೆನನ್ ಅವರು 8 ತಿಂಗಳು ಬಾಹ್ಯಾಕಾಶ ಕೇಂದ್ರದಲ್ಲಿದ್ದು ಅಧ್ಯಯನ ನಡೆಸಿ 2027ಕ್ಕೆ ಮರಳಲಿದ್ದಾರೆ." },
    { q: "ಇತ್ತೀಚೆಗೆ ಬಾಹ್ಯಾಕಾಶಯಾನಕ್ಕೆ ಆಯ್ಕೆಯಾದ ಭಾರತೀಯ ಗಗನಯಾನಿ ಯಾರು?", options: ["ಶುಭಾಂಶು ಶುಕ್ಲ", "ಅನಿಲ್ ಮೆನನ್", "ಪ್ರಶಾಂತ್ ಬಾಲಕೃಷ್ಣನ್", "ಅಂಗದ್ ಪ್ರತಾಪ್"], answer: 0, exp: "ಶುಭಾಂಶು ಶುಕ್ಲ ಇತ್ತೀಚೆಗೆ ಅಂತರರಾಷ್ಟ್ರೀಯ ಬಾಹ್ಯಾಕಾಶ ಕೇಂದ್ರಕ್ಕೆ ಪ್ರಯಾಣಿಸಲು ಆಯ್ಕೆಯಾದ ಗಗನಯಾನಿ." },
    { q: "ಚಂಡಮಾರುತದಿಂದಾಗಿ ಸಂಪರ್ಕ ಕಳೆದುಕೊಂಡು ಪ್ರಸ್ತುತ ಲೈನ್ನಲ್ಲಿ ಇಲ್ಲದಿರುವ ಉಪಗ್ರಹ ಮಿಷನ್ ಯಾವುದು?", options: ["ಆಪ್ಟು ಸ್ಟಾರ್ (Apstar)", "ಇನ್ಸಾಟ್", "ಕಾರ್ಟೋಸ್ಯಾಟ್", "ಆಸ್ಟ್ರೋಸ್ಯಾಟ್"], answer: 0, exp: "ಆಪ್ಟು ಸ್ಟಾರ್ ಉಪಗ್ರಹ ಮಿಷನ್ ದೃಷ್ಟಿಯಿಂದ ಚಂಡಮಾರುತದಿಂದ ಸಂಪರ್ಕವನ್ನು ಕಳೆದುಕೊಂಡಿದೆ." },
    { q: "2026ರ 23ನೇ ಆವೃತ್ತಿಯ ಫಿಫಾ (FIFA) ಚಾಂಪಿಯನ್ ತಂಡ ಯಾವುದು?", options: ["ಸ್ಪೇನ್", "ಅರ್ಜೆಂಟೀನಾ", "ಇಂಗ್ಲೆಂಡ್", "ಫ್ರಾನ್ಸ್"], answer: 0, exp: "23ನೇ ಆವೃತ್ತಿಯ ಫಿಫಾ 2026ರ ಚಾಂಪಿಯನ್ ಸ್ಪೇನ್ ಆಗಿದೆ." },
    { q: "2026ರ ಫಿಫಾ ಟೂರ್ನಿಯ ರನ್ನರ್-ಅಪ್ ತಂಡ ಯಾವುದು?", options: ["ಫ್ರಾನ್ಸ್ / ಅರ್ಜೆಂಟೀನಾ", "ಸ್ಪೇನ್", "ಇಂಗ್ಲೆಂಡ್", "ಜರ್ಮನಿ"], answer: 0, exp: "ಫಿಫಾ 2026ರ ಫೈನಲ್‌ನಲ್ಲಿ ಸ್ಪೇನ್ ವಿರುದ್ಧ ಸೋತು ರನ್ನರ್-ಅಪ್ ಆದ ತಂಡ." },
    { q: "2026ರ ಫಿಫಾ ವಿಶ್ವಕಪ್‌ನಲ್ಲಿ ಮೂರನೇ ಸ್ಥಾನ (Third Place) ಪಡೆದ ದೇಶ ಯಾವುದು?", options: ["ಇಂಗ್ಲೆಂಡ್", "ಸ್ಪೇನ್", "ಬ್ರೆಜಿಲ್", "ಕ್ರೊಯೇಷಿಯಾ"], answer: 0, exp: "ಫಿಫಾ 2026ರಲ್ಲಿ ಇಂಗ್ಲೆಂಡ್ ಮೂರನೇ ಸ್ಥಾನವನ್ನು ಗಳಿಸಿದೆ." },
    { q: "ಅರ್ಜೆಂಟೀನಾ ಫುಟ್‌ಬಾಲ್ ತಂಡದ ನಾಯಕ ಯಾರು?", options: ["ಲಿಯೋನೆಲ್ ಮೆಸ್ಸಿ", "ಕ್ರಿಸ್ಟಿಯಾನೋ ರೊನಾಲ್ಡೊ", "ನೆಮಾರ್", "ಎಂಬಾಪೆ"], answer: 0, exp: "ಅರ್ಜೆಂಟೀನಾದ ನಾಯಕರಾಗಿ ಲಿಯೋನೆಲ್ ಮೆಸ್ಸಿ ಮುನ್ನಡೆಸುತ್ತಿದ್ದಾರೆ." },
    { q: "ಫಿಫಾ ಟೂರ್ನಿಯಲ್ಲಿ ಅತಿ ಹೆಚ್ಚು ಗೋಲು ಗಳಿಸಿ 'ಗೋಲ್ಡನ್ ಬೂಟ್' ಪಡೆದ ಆಟಗಾರ ಯಾರು?", options: ["ಕೈಲಿಯನ್ ಎಂಬಾಪೆ", "ಮೆಸ್ಸಿ", "ರೋಡ್ರಿ", "ವಿನಯ್ ಸೈಮನ್"], answer: 0, exp: "ಕೈಲಿಯನ್ ಎಂಬಾಪೆ ಅತಿ ಹೆಚ್ಚು ಗೋಲು ಗಳಿಸಿ ಗೋಲ್ಡನ್ ಬೂಟ್ ಪಡೆದುಕೊಂಡಿದ್ದಾರೆ." },
    { q: "ಫಿಫಾ ಪ್ರಶಸ್ತಿಯಲ್ಲಿ 'ಗೋಲ್ಡನ್ ಗ್ಲೋವ್ಸ್' ಪಡೆದವರು ಯಾರು?", options: ["ವಿನಯ್ ಸೈಮನ್", "ರೋಡ್ರಿ", "ಮೆಸ್ಸಿ", "ಎಂಬಾಪೆ"], answer: 0, exp: "ಅತ್ಯುತ್ತಮ ಗೋಲ್‌ಕೀಪರ್‌ಗೆ ನೀಡಲಾಗುವ ಗೋಲ್ಡನ್ ಗ್ಲೋವ್ಸ್ ಅನ್ನು ವಿನಯ್ ಸೈಮನ್ ಪಡೆದಿದ್ದಾರೆ." },
    { q: "ಫಿಫಾ ಪ್ರಶಸ್ತಿಯಲ್ಲಿ ಅತ್ಯುತ್ತಮ ಆಟಗಾರನಿಗೆ ನೀಡುವ 'ಗೋಲ್ಡನ್ ಬಾಲ್' ಪಡೆದವರು ಯಾರು?", options: ["ರೋಡ್ರಿ (Rodri)", "ಮೆಸ್ಸಿ", "ಎಂಬಾಪೆ", "ಸೈಮನ್"], answer: 0, exp: "ರೋಡ್ರಿ ಅವರು ಅತ್ಯುತ್ತಮ ಪ್ರದರ್ಶನಕ್ಕಾಗಿ ಗೋಲ್ಡನ್ ಬಾಲ್ ಪಡೆದುಕೊಂಡಿದ್ದಾರೆ." },
    { q: "72ನೇ ರಾಷ್ಟ್ರೀಯ ಚಲನಚಿತ್ರ ಪ್ರಶಸ್ತಿಯಲ್ಲಿ ಕನ್ನಡಕ್ಕೆ ಒಟ್ಟು ಎಷ್ಟು ಪ್ರಶಸ್ತಿಗಳು ಬಂದಿವೆ?", options: ["4 ಪ್ರಶಸ್ತಿಗಳು", "5 ಪ್ರಶಸ್ತಿಗಳು", "3 ಪ್ರಶಸ್ತಿಗಳು", "2 ಪ್ರಶಸ್ತಿಗಳು"], answer: 0, exp: "ಕನ್ನಡಕ್ಕೆ 4 ಪ್ರಶಸ್ತಿ ಹಾಗೂ ತುಳು ಭಾಷೆಗೆ 1 ಪ್ರಶಸ್ತಿ ಬಂದಿದೆ. ಕನ್ನಡದ 4ರಲ್ಲಿ 3 'ಮಿಥ್ಯಾ' ಚಿತ್ರಕ್ಕೆ ದೊರೆತಿದೆ." },
    { q: "ಮಮ್ಮುಟ್ಟಿ ಅವರ 'ಬ್ರಹ್ಮಯುಗಂ' ಮತ್ತು ಕಾರ್ತಿಕ್ ಆರ್ಯನ್ ಅವರ 'ಚಂದು ಚಾಂಪಿಯನ್' ಚಿತ್ರಗಳು ಯಾವುದಕ್ಕೆ ಸಂಬಂಧಿಸಿವೆ?", options: ["ರಾಷ್ಟ್ರೀಯ ಚಲನಚಿತ್ರ ಪ್ರಶಸ್ತಿ ಪುರಸ್ಕೃತ ಚಿತ್ರಗಳು", "ಆಸ್ಕರ್ ನಾಮನಿರ್ದೇಶನ", "ಒಟಿಟಿ ರಿಲೀಸ್", "ಕಿರುಚಿತ್ರಗಳು"], answer: 0, exp: "ಇವು ಪ್ರಮುಖ ಪ್ರಶಸ್ತಿ ವಿಜೇತ ಪ್ರಾದೇಶಿಕ ಚಲನಚಿತ್ರಗಳಾಗಿವೆ." },

    { q: "ಅತ್ಯುತ್ತಮ ಬಾಲ ಕಲಾವಿದ ಪ್ರಶಸ್ತಿ ಪಡೆದ ಅತಿಶ್ ಶೆಟ್ಟಿ ಯಾವ ಕನ್ನಡ ಚಿತ್ರದಲ್ಲಿ ನಟಿಸಿದ್ದಾನೆ?", options: ["ಮಿಥ್ಯಾ", "ಕಾಂತಾರ", "ಕೆಜಿಎಫ್", "ಚಾರ್ಲಿ"], answer: 0, exp: "ಅತಿಶ್ ಶೆಟ್ಟಿ 'ಮಿಥ್ಯಾ' ಕನ್ನಡ ಚಿತ್ರದ ನಟನೆಗಾಗಿ ಪ್ರಶಸ್ತಿ ಪಡೆದಿದ್ದಾರೆ." },

    { q: "ಅಟಾರ್ನಿ ಜನರಲ್ (Article 76) ಅವರ ಪ್ರಮುಖ ಕಾರ್ಯವೇನು?", options: ["ದೇಶದ ಅತ್ಯುನ್ನತ ಕಾನೂನು ಅಧಿಕಾರಿ, ವಿಧಿ 143ರಡಿ ಸುಪ್ರೀಂ ಕೋರ್ಟ್ ಸಲಹೆ ವೇಳೆ ಸರ್ಕಾರ ಪ್ರತಿನಿಧಿಸುವುದು", "ರಾಜ್ಯದ ಕಾನೂನು ಅಧಿಕಾರಿ", "ಚುನಾವಣೆ ನಡೆಸುವುದು", "ಲೆಕ್ಕ ಪರಿಶೋಧನೆ"], answer: 0, exp: "ಸಂವಿಧಾನದ ವಿಧಿ 76 ದೇಶದ ಅತ್ಯುನ್ನತ ಕಾನೂನು ಅಧಿಕಾರಿಯಾಗಿ ಅಟಾರ್ನಿ ಜನರಲ್‌ ಹುದ್ದೆ ಸೃಷ್ಟಿಸುತ್ತದೆ." },
    { q: "ಅಡ್ವೊಕೇಟ್ ಜನರಲ್ (Article 165) ಕುರಿತು ಸರಿಯಾದ ಹೇಳಿಕೆ ಯಾವುದು?", options: ["ರಾಜ್ಯದ ಅತ್ಯುನ್ನತ ಕಾನೂನು ಅಧಿಕಾರಿ, ರಾಜ್ಯಪಾಲರು ಸೂಚಿಸಿದ ಕಾನೂನು ಸಲಹೆ ನೀಡುವುದು, ಸಂವಿಧಾನದಲ್ಲಿ ವೇತನ ನಿಗದಿಯಾಗಿಲ್ಲ", "ಕೇಂದ್ರದ ಅಧಿಕಾರಿ", "ಸಂಸತ್ತಿನ ಸದಸ್ಯ", "ಖಾಸಗಿ ವಕೀಲರಲ್ಲ"], answer: 0, exp: "ವಿಧಿ 165 ರಂತೆ ಅಡ್ವೊಕೇಟ್ ಜನರಲ್ ರಾಜ್ಯ ಸರ್ಕಾರದ ಮುಖ್ಯ ಕಾನೂನು ಸಲಹೆಗಾರ." },
    { q: "ಅಟಾರ್ನಿ/ಅಡ್ವೊಕೇಟ್ ಜನರಲ್ ಅವರಿಗೆ ಸಂಸತ್/ಶಾಸಕಾಂಗದಲ್ಲಿ ಇರುವ ಹಕ್ಕು ಏನು?", options: ["ಚರ್ಚೆಯಲ್ಲಿ ಭಾಗವಹಿಸಬಹುದು, ಆದರೆ ಮತ ಹಾಕುವಂತಿಲ್ಲ", "ಮತ ಹಾಕಬಹುದು", "ಸಭಾಪತಿಯಾಗಬಹುದು", "ಯಾವ ಹಕ್ಕೂ ಇಲ್ಲ"], answer: 0, exp: "ಇಬ್ಬರೂ ಸದನದ ನಡಾವಳಿಗಳಲ್ಲಿ ಭಾಗವಹಿಸಬಹುದು ಆದರೆ ಮತದಾನದ ಹಕ್ಕಿರುವುದಿಲ್ಲ." },
    { q: "ಅಡ್ವೊಕೇಟ್ ಜನರಲ್ ಅವರ ವೃತ್ತಿಪರ ಸ್ವರೂಪವೇನು?", options: ["ಸರ್ಕಾರಿ ನೌಕರರಲ್ಲ, ಪೂರ್ಣಾವಧಿ ಸಲಹೆಗಾರರಲ್ಲ, ಅಧಿಕಾರ ಮುಗಿದ ಮೇಲೆ ವಕೀಲ ವೃತ್ತಿ ಮುಂದುವರಿಸಬಹುದು", "ಸರ್ಕಾರಿ ನೌಕರರು", "ಜಡ್ಜ್‌ಗಳು", "ಖಾಸಗಿ ಕೆಲಸ ಮಾಡುವಂತಿಲ್ಲ"], answer: 0, exp: "ಅವರು ಸರ್ಕಾರದ ಪೂರ್ಣಾವಧಿ ನೌಕರರಲ್ಲದ ಕಾರಣ ವಕೀಲ ವೃತ್ತಿ ನಡೆಸಬಹುದು." },
    { q: "ದೇಶದ ಎರಡನೇ ಅತ್ಯುನ್ನತ ಕಾನೂನು ಅಧಿಕಾರಿ ಯಾರು?", options: ["ಸೊಲಿಸಿಟರ್ ಜನರಲ್ (ಸಾಂವಿಧಾನಿಕವೂ ಅಲ್ಲ, ಶಾಸನಬದ್ಧವೂ ಅಲ್ಲ)", "ಅಡ್ವೊಕೇಟ್ ಜನರಲ್", "ಸಿಜೆಐ", "ಕಾನೂನು ಕಾರ್ಯದರ್ಶಿ"], answer: 0, exp: "ಸೊಲಿಸಿಟರ್ ಜನರಲ್ ಅಟಾರ್ನಿ ಜನರಲ್‌ಗೆ ನೆರವಾಗುವ 2ನೇ ಪ್ರಮುಖ ಅಧಿಕಾರಿ." },
    { q: "ಭಾರತದ ಪ್ರಸ್ತುತ ಅಟಾರ್ನಿ ಜನರಲ್ (AG) ಯಾರು?", options: ["ಆರ್. ವೆಂಕಟರಮಣಿ (2022 ರಿಂದ)", "ಕೆ.ಕೆ. ವೇಣುಗೋಪಾಲ್", "ಮುಕುಲ್ ರೋಹತ್ಗಿ", "ಹರೀಶ್ ಸಾಳ್ವೆ"], answer: 0, exp: "ಆರ್. ವೆಂಕಟರಮಣಿ ಅವರು ಪ್ರಸ್ತುತ ಭಾರತದ 16ನೇ ಅಟಾರ್ನಿ ಜನರಲ್." },
    { q: "ರಾಷ್ಟ್ರೀಯ ಎಸ್‌ಸಿ (338) ಮತ್ತು ಎಸ್‌ಟಿ (338A) ಆಯೋಗಗಳ ಅಧಿಕಾರಾವಧಿ ಎಷ್ಟು ವರ್ಷ?", options: ["3 ವರ್ಷಗಳು", "5 ವರ್ಷಗಳು", "6 ವರ್ಷಗಳು", "2 ವರ್ಷಗಳು"], answer: 0, exp: "ಪರಿಶಿಷ್ಟ ಜಾತಿ ಮತ್ತು ಪರಿಶಿಷ್ಟ ಪಂಗಡಗಳ ರಾಷ್ಟ್ರೀಯ ಆಯೋಗದ ಸದಸ್ಯರ ಅವಧಿ 3 ವರ್ಷ." },
    { q: "ಕೇಂದ್ರ ಲೋಕಸೇವಾ ಆಯೋಗ (UPSC) ಸಂವಿಧಾನದ ಯಾವ ವಿಧಿಯಲ್ಲಿದೆ?", options: ["ವಿಧಿ 315", "ವಿಧಿ 324", "ವಿಧಿ 280", "ವಿಧಿ 370"], answer: 0, exp: "ಸಂವಿಧಾನದ 14ನೇ ಭಾಗದ ವಿಧಿ 315 ಯುಪಿಎಸ್‌ಸಿ ಸ್ಥಾಪನೆಗೆ ಅವಕಾಶ ನೀಡುತ್ತದೆ." },
    { q: "ರಾಜ್ಯ ಲೋಕಸೇವಾ ಆಯೋಗ (KPSC) ಯಾವ ವಿಧಿ ಮತ್ತು ಭಾಗದಲ್ಲಿದೆ?", options: ["ವಿಧಿ 315, ಭಾಗ 14", "ವಿಧಿ 300, ಭಾಗ 10", "ವಿಧಿ 320, ಭಾಗ 12", "ವಿಧಿ 250, ಭಾಗ 5"], answer: 0, exp: "ಕೇಂದ್ರ ಮತ್ತು ರಾಜ್ಯ ಲೋಕಸೇವಾ ಆಯೋಗಗಳು ವಿಧಿ 315ರಡಿಯೇ ಬರುತ್ತವೆ." },
    { q: "UPSC ಮತ್ತು KPSC ಪ್ರಧಾನ ಕಚೇರಿಗಳು ಎಲ್ಲೆಲ್ಲಿವೆ?", options: ["UPSC: ನವದೆಹಲಿ, KPSC: ಬೆಂಗಳೂರು", "UPSC: ಮುಂಬೈ, KPSC: ಮೈಸೂರು", "ಎರಡೂ ದೆಹಲಿಯಲ್ಲಿವೆ", "UPSC: ಕಲ್ಕತ್ತಾ, KPSC: ಬೆಳಗಾವಿ"], answer: 0, exp: "ಯುಪಿಎಸ್‌ಸಿ ಕೇಂದ್ರ ಕಚೇರಿ ನವದೆಹಲಿಯ ಧೋಲ್‌ಪುರ್ ಹೌಸ್‌ನಲ್ಲಿದ್ದರೆ, ಕೆಪಿಎಸ್‌ಸಿ ಬೆಂಗಳೂರಿನಲ್ಲಿದೆ." },
    { q: "UPSC ಅಧ್ಯಕ್ಷರ/ಸದಸ್ಯರ ಅಧಿಕಾರಾವಧಿ ಎಷ್ಟು?", options: ["6 ವರ್ಷ ಅಥವಾ 65 ವರ್ಷ ವಯಸ್ಸು (ಯಾವುದು ಮೊದಲೋ ಅದು)", "5 ವರ್ಷ ಅಥವಾ 60 ವರ್ಷ", "6 ವರ್ಷ ಅಥವಾ 62 ವರ್ಷ", "3 ವರ್ಷ"], answer: 0, exp: "UPSC ಸದಸ್ಯರ ವಯೋಮಿತಿ ಗರಿಷ್ಠ 65 ವರ್ಷ ಅಥವಾ 6 ವರ್ಷಗಳ ಅವಧಿ." },
    { q: "KPSC ಅಧ್ಯಕ್ಷರ/ಸದಸ್ಯರ ಅಧಿಕಾರಾವಧಿ ಎಷ್ಟು?", options: ["6 ವರ್ಷ ಅಥವಾ 62 ವರ್ಷ ವಯಸ್ಸು", "6 ವರ್ಷ ಅಥವಾ 65 ವರ್ಷ", "5 ವರ್ಷ ಅಥವಾ 60 ವರ್ಷ", "4 ವರ್ಷ"], answer: 0, exp: "ರಾಜ್ಯ ಲೋಕಸೇವಾ ಆಯೋಗದ ಸದಸ್ಯರ ನಿವೃತ್ತಿ ವಯಸ್ಸು 62 ವರ್ಷ." },
    { q: "UPSC ಮತ್ತು KPSC ವೆಚ್ಚಗಳನ್ನು ಯಾವ ನಿಧಿಯಿಂದ ಭರಿಸಲಾಗುತ್ತದೆ?", options: ["UPSC: ಕೇಂದ್ರ ಸಂಚಿತ ನಿಧಿ, KPSC: ರಾಜ್ಯ ಸಂಚಿತ ನಿಧಿ", "ಆಕಸ್ಮಿಕ ನಿಧಿ", "ಸಾರ್ವಜನಿಕ ಖಾತೆ", "ಆರ್‌ಬಿಐ"], answer: 0, exp: "ಇವುಗಳ ವೆಚ್ಚವನ್ನು ಅನುಕ್ರಮವಾಗಿ ಕೇಂದ್ರ ಮತ್ತು ರಾಜ್ಯಗಳ ಸಂಚಿತ ನಿಧಿಯಿಂದ (Consolidated Fund) ನೀಡಲಾಗುತ್ತದೆ." },
    { q: "‘UPSC ದಿನ’ ವನ್ನು ಪ್ರತಿವರ್ಷ ಎಂದು ಆಚರಿಸಲಾಗುತ್ತದೆ?", options: ["ಅಕ್ಟೋಬರ್ 1", "ನವೆಂಬರ್ 26", "ಆಗಸ್ಟ್ 15", "ಜನವರಿ 26"], answer: 0, exp: "1926 ಅಕ್ಟೋಬರ್ 1 ರಂದು ಪಬ್ಲಿಕ್ ಸರ್ವಿಸ್ ಕಮಿಷನ್ ಸ್ಥಾಪನೆಯಾಗಿದ್ದರಿಂದ ಅಕ್ಟೋಬರ್ 1 ಯುಪಿಎಸ್‌ಸಿ ದಿನ." },
    { q: "‘ಭಾರತೀಯ ಸಿವಿಲ್ ಸೇವೆಗಳ ಪಿತಾಮಹ’ (Father of Indian Civil Services) ಯಾರು?", options: ["ಲಾರ್ಡ್ ಕಾರ್ನ್‌ವಾಲಿಸ್", "ಲಾರ್ಡ್ ಡಾಲ್ ಹೌಸಿ", "ಸರ್ದಾರ್ ಪಟೇಲ್", "ಲಾರ್ಡ್ ಕ್ಯಾನಿಂಗ್"], answer: 0, exp: "ಭಾರತದಲ್ಲಿ ಸಿವಿಲ್ ಸೇವೆಗಳನ್ನು ಶಾಸನಬದ್ಧವಾಗಿ ತಂದವರು ಕಾರ್ನ್‌ವಾಲಿಸ್." },
    { q: "‘ಅಖಿಲ ಭಾರತ ಸೇವೆಗಳ ಪಿತಾಮಹ’ (Father of All India Services) ಯಾರು ಮತ್ತು ಇದು ಯಾವ ಭಾಗದಲ್ಲಿದೆ?", options: ["ಸರ್ದಾರ್ ವಲ್ಲಭಭಾಯಿ ಪಟೇಲ್ (ಭಾಗ 14)", "ನೆಹರೂ", "ಅಂಬೇಡ್ಕರ್", "ಕಾರ್ನ್‌ವಾಲಿಸ್"], answer: 0, exp: "ಸರ್ದಾರ್ ಪಟೇಲರನ್ನು ಅಖಿಲ ಭಾರತ ಸೇವೆಗಳ (IAS, IPS, IFS) ಪಿತಾಮಹ ಎನ್ನಲಾಗುತ್ತದೆ." },
    { q: "1855ರಲ್ಲಿ ಸ್ಪರ್ಧಾತ್ಮಕ ICS ಪರೀಕ್ಷೆಗೆ ನಿಗದಿಪಡಿಸಿದ್ದ ವಯೋಮಿತಿ ಎಷ್ಟಾಗಿತ್ತು?", options: ["ಕನಿಷ್ಠ 18, ಗರಿಷ್ಠ 23-24 ವರ್ಷ", "ಕನಿಷ್ಠ 21, ಗರಿಷ್ಠ 30", "ಕನಿಷ್ಠ 16, ಗರಿಷ್ಠ 20", "ಕನಿಷ್ಠ 25, ಗರಿಷ್ಠ 35"], answer: 0, exp: "1855ರ ಕಾಯ್ದೆಯಡಿ ಕನಿಷ್ಠ 18 ಹಾಗೂ ಗರಿಷ್ಠ 23-24 ವರ್ಷ ನಿಗದಿ ಮಾಡಲಾಗಿತ್ತು." },
    { q: "ICS ನ ಪೂರ್ಣ ರೂಪವೇನು?", options: ["ಇಂಪೀರಿಯಲ್ ಸಿವಿಲ್ ಸರ್ವಿಸ್ (Imperial Civil Service)", "ಇಂಡಿಯನ್ ಕಾನ್ಸ್ಟೇಬಲ್ ಸರ್ವಿಸ್", "ಇಂಡಿಯನ್ ಸೆಂಟ್ರಲ್ ಸರ್ವಿಸ್", "ಇಂಟರ್ನ್ಯಾಷನಲ್ ಸಿವಿಲ್ ಸರ್ವಿಸ್"], answer: 0, exp: "ಬ್ರಿಟಿಷ್ ಆಡಳಿತಾವಧಿಯಲ್ಲಿ IAS ಅನ್ನು ಇಂಪೀರಿಯಲ್ ಸಿವಿಲ್ ಸರ್ವಿಸ್ ಎನ್ನಲಾಗುತ್ತಿತ್ತು." },
    { q: "ರಾಷ್ಟ್ರೀಯ ಮತ್ತು ರಾಜ್ಯ ಮಾನವ ಹಕ್ಕುಗಳ ಆಯೋಗದ (NHRC & SHRC) ರಚನೆ ಹೇಗೆ?", options: ["NHRC: 1 + 5 ಸದಸ್ಯರು, SHRC: 1 + 2 ಸದಸ್ಯರು", "NHRC: 1 + 10, SHRC: 1 + 5", "NHRC: 1 + 2, SHRC: 1 + 1", "ಎರಡರಲ್ಲೂ 5 ಸದಸ್ಯರು"], answer: 0, exp: "ರಾಷ್ಟ್ರೀಯ ಆಯೋಗದಲ್ಲಿ ಅಧ್ಯಕ್ಷ ಸೇರಿ 6 (1+5) ಹಾಗೂ ರಾಜ್ಯ ಆಯೋಗದಲ್ಲಿ 3 (1+2) ಮಂದಿ ಇರುತ್ತಾರೆ." },

    { q: "ಮೊದಲ ಕಾಂಗ್ರೆಸ್ಸೇತರ ಸರ್ಕಾರದ ಪ್ರಧಾನಿ ಮತ್ತು ಅವರ ಬೆಂಬಲಿತ ನಾಯಕರು ಯಾರು?", options: ["ಮೊರಾರ್ಜಿ ದೇಸಾಯಿ ಮತ್ತು ಚೌಧರಿ ಚರಣ್ ಸಿಂಗ್ (ಜನತಾ ಪಕ್ಷ - 1977)", "ವಿ.ಪಿ. ಸಿಂಗ್", "ಅಟಲ್ ಬಿಹಾರಿ ವಾಜಪೇಯಿ", "ದೇವೇಗೌಡ"], answer: 0, exp: "1977ರಲ್ಲಿ ಜನತಾ ಪಕ್ಷದ ನೇತೃತ್ವದಲ್ಲಿ ಮೊರಾರ್ಜಿ ದೇಸಾಯಿ ಪ್ರಧಾನಿಯಾದರು." },
    { q: "ಚುನಾವಣಾ ಅಭ್ಯರ್ಥಿಗಳಿಗೆ ನಾಮನಿರ್ದೇಶನ ಪ್ರಕ್ರಿಯೆ ವೇಗಗೊಳಿಸಲು ಜಾರಿಗೆ ತಂದ ಪೋರ್ಟಲ್ ಯಾವುದು?", options: ["ಸುವಿಧಾ ಪೋರ್ಟಲ್ (Suvidha Portal)", "ಸಿವಿಜಿಲ್", "ಸಾಕ್ಷಮ್", "ಇ-ಸಿನೆಟ್"], answer: 0, exp: "ಸುವಿಧಾ ಪೋರ್ಟಲ್ ಮೂಲಕ ಅಭ್ಯರ್ಥಿಗಳಿಗೆ ಸುಲಭವಾಗಿ ಅನುಮತಿ ಮತ್ತು ನಾಮಪತ್ರ ಸಲ್ಲಿಕೆಗೆ ಅವಕಾಶ ನೀಡಲಾಗುತ್ತದೆ." },
    { q: "ಅಂಗವಿಕಲರನ್ನು ಮತದಾರರ ಪಟ್ಟಿಗೆ ಸೇರ್ಪಡೆಗೊಳಿಸಲು ಇರುವ ಆಪ್ ಯಾವುದು?", options: ["ಸಾಕ್ಷಮ್ ಆಪ್ (Saksham App)", "ಸುವಿಧಾ", "ನೋಟಾ", "ಗರಡಾ"], answer: 0, exp: "ವಿಶೇಷ ಚೇತನ ಮತದಾರರಿಗೆ ನೆರವಾಗಲು 'ಸಾಕ್ಷಮ್' ಆಪ್ ಅನ್ನು ಇಸಿಐ ತಂದಿದೆ." },
    { q: "ಕರ್ನಾಟಕ ಚುನಾವಣೆಯಲ್ಲಿ ಹಂತವಾರು ಮತದಾನ ಶೇಕಡಾವಾರು ಪ್ರಕಟಿಸಲು ಬಳಸಿದ ಆಪ್ ಯಾವುದು?", options: ["ವೋಟ್ ಕರ್ನಾಟಕ (Vote Karnataka / Voter Turnout App)", "ಸಿವಿಜಿಲ್", "ಸುವಿಧಾ", "ಸಾಕ್ಷಮ್"], answer: 0, exp: "ಚುನಾವಣಾ ದಿನದಂದು ಮತದಾನದ ಪ್ರಮಾಣ ಪ್ರಕಟಿಸಲು ಬಳಸುವ ಆಪ್." },
    { q: "ಚುನಾವಣಾ ನೀತಿ ಸಂಹಿತೆ ಉಲ್ಲಂಘನೆ ಬಗ್ಗೆ ದೂರು ನೀಡಲು ಇಸಿಐ ಬಿಡುಗಡೆ ಮಾಡಿದ ಆಪ್ ಯಾವುದು?", options: ["ಸಿ-ವಿಜಿಲ್ (cVIGIL)", "ಸುವಿಧಾ", "ಸಾಕ್ಷಮ್", "ಈಸಿನೆಟ್"], answer: 0, exp: "ನಾಗರಿಕರು ಫೋಟೋ/ವಿಡಿಯೋ ಉಲ್ಲಂಘನೆ ಬಗ್ಗೆ ನೇರ ದೂರು ನೀಡಲು cVIGIL ಆಪ್ ಬಳಸಬಹುದು." },
    { q: "ಚುನಾವಣಾ ವೀಕ್ಷಕರು ವರದಿ ಸಲ್ಲಿಸಲು ಇಸಿಐ ರೂಪಿಸಿದ ಆಪ್ ಯಾವುದು?", options: ["ವೀಕ್ಷಕ್ ಆಪ್ (Observer App)", "ಸಿವಿಜಿಲ್", "ಸುವಿಧಾ", "ಗರಡಾ"], answer: 0, exp: "ಚುನಾವಣಾ ವೀಕ್ಷಕರು ನೇರವಾಗಿ ಸುಲಭ ವರದಿ ಸಲ್ಲಿಸಲು ವೀಕ್ಷಕ್ ಆಪ್ ಬಳಸಲಾಗುತ್ತದೆ." },
    { q: "ಬಿಹಾರ ವಿಧಾನಸಭಾ ಚುನಾವಣೆ ವೇಳೆ ಸಮಗ್ರ ನಿರ್ವಹಣೆಗೆ ಇಸಿಐ ತಂದ ಆಪ್ ಯಾವುದು?", options: ["ಈ-ಸಿನೆಟ್ (ECINET)", "ಸುವಿಧಾ", "ಸಿವಿಜಿಲ್", "ಸಾಕ್ಷಮ್"], answer: 0, exp: "ಎಲ್ಲಾ ಅಪ್ಲಿಕೇಶನ್‌ಗಳನ್ನು ಕ್ರೋಡೀಕರಿಸಿ ಇಸಿಐ ರೂಪಿಸಿದ ಜಾಲ 'ECINET'." },
    { q: "‘ದೇಶದ ಖಜಾನೆ ಕಾಯುವ ಕಾವಲು ನಾಯಿ’ (Watchdog of Public Purse) ಎಂದು ಯಾರನ್ನು ಕರೆಯಲಾಗುತ್ತದೆ?", options: ["ಸಿಎಜಿ (CAG - Comptroller and Auditor General)", "ಆರ್‌ಬಿಐ ಗವರ್ನರ್", "ಹಣಕಾಸು ಸಚಿವರು", "ಸಿಬಿಐ"], answer: 0, exp: "ಡಾ. ಬಿ.ಆರ್. ಅಂಬೇಡ್ಕರ್ ಅವರು ಸಿಎಜಿ ಹುದ್ದೆಯನ್ನು ಅತ್ಯಂತ ಪ್ರಮುಖ ಕಾವಲು ನಾಯಿ ಎಂದಿದ್ದಾರೆ." },
    { q: "CAG ತಮ್ಮ ಕೇಂದ್ರದ ಲೆಕ್ಕ ಪರಿಶೋಧನಾ ವರದಿಯನ್ನು ಯಾರಿಗೆ ಸಲ್ಲಿಸುತ್ತಾರೆ?", options: ["ರಾಷ್ಟ್ರಪತಿಗಳಿಗೆ (ಅವರು ಸಂಸತ್ತಿನ ಮುಂದೆ ಮಂಡಿಸುತ್ತಾರೆ -> PAC)", "ಪ್ರಧಾನಿಯವರಿಗೆ", "ಸಭಾಪತಿಗೆ", "ಹಣಕಾಸು ಸಚಿವರಿಗೆ"], answer: 0, exp: "ಸಿಎಜಿ ವರದಿಯನ್ನು ರಾಷ್ಟ್ರಪತಿಗಳು ಸಂಸತ್ತಿನ ಉಭಯ ಸದನಗಳಲ್ಲಿ ಮಂಡಿಸಿ ಸಾರ್ವಜನಿಕ ಲೆಕ್ಕಪತ್ರ ಸಮಿತಿಗೆ (PAC) ಕಳುಹಿಸುತ್ತಾರೆ." },
    { q: "CAG ತಮ್ಮ ರಾಜ್ಯದ ಲೆಕ್ಕ ಪರಿಶೋಧನಾ ವರದಿಯನ್ನು ಯಾರಿಗೆ ಸಲ್ಲಿಸುತ್ತಾರೆ?", options: ["ರಾಜ್ಯಪಾಲರಿಗೆ (ಅವರು ಶಾಸಕಾಂಗದ ಮುಂದೆ ಮಂಡಿಸುತ್ತಾರೆ -> PAC)", "ಮುಖ್ಯಮಂತ್ರಿಗೆ", "ಸ್ಪೀಕರ್‌ಗೆ", "ಹೈಕೋರ್ಟ್‌ಗೆ"], answer: 0, exp: "ರಾಜ್ಯ ಮಟ್ಟದ ವರದಿಯನ್ನು ರಾಜ್ಯಪಾಲರು ಶಾಸಕಾಂಗದ ಮುಂದೆ ಮಂಡಿಸಿ ಪಿಎಸಿ ಸಮಿತಿಗೆ ಪರಿಶೀಲನೆಗೆ ನೀಡುತ್ತಾರೆ." },
    { q: "ರಾಷ್ಟ್ರಗೀತೆಯನ್ನು (Jana Gana Mana) ಎಂದು ಅಂಗೀಕರಿಸಲಾಯಿತು ಮತ್ತು ಮೊದಲು ಯಾರು ಹಾಡಿದರು?", options: ["1950 ಜನವರಿ 24 ಅಂಗೀಕಾರ (1911 ಡಿಸೆಂಬರ್ 27 ಕಲ್ಕತ್ತಾ ಅಧಿವೇಶನದಲ್ಲಿ ಸರಳಾದೇವಿ ಹಾಡಿದರು)", "1947 ಆಗಸ್ಟ್ 15", "1950 ಜನವರಿ 26", "1896 ಕಲ್ಕತ್ತಾ"], answer: 0, exp: "ರವೀಂದ್ರನಾಥ ಟ್ಯಾಗೋರ್ ರಚಿತ ಗೀತೆಯನ್ನು 1911ರಲ್ಲಿ ಸರಳಾದೇವಿ ಚೌಧುರಾಣಿ ಮೊದಲು ಹಾಡಿದ್ದರು." },
    { q: "ರಾಷ್ಟ್ರೀಯ ಹಾಡು 'ವಂದೇ ಮಾತರಂ' ಅನ್ನು ಯಾರು ರಚಿಸಿದರು ಮತ್ತು ಮೊದಲು ಯಾರು ಹಾಡಿದರು?", options: ["ಬಂಕಿಮ ಚಂದ್ರ ಚಟರ್ಜಿ ರಚನೆ (1896 ಕಲ್ಕತ್ತಾ ಅಧಿವೇಶನದಲ್ಲಿ ರವೀಂದ್ರನಾಥ ಟ್ಯಾಗೋರ್ ಹಾಡಿದರು)", "ಟ್ಯಾಗೋರ್ ರಚನೆ", "ಸರೋಜಿನಿ ನಾಯ್ಡು", "ಅರವಿಂದ ಘೋಷ್"], answer: 0, exp: "ವಂದೇ ಮಾತರಂ ಅನ್ನು 1896ರ ಕಾಂಗ್ರೆಸ್ ಅಧಿವೇಶನದಲ್ಲಿ ರವೀಂದ್ರನಾಥ ಟ್ಯಾಗೋರ್ ಪ್ರಥಮವಾಗಿ ಗಾಯನ ಮಾಡಿದರು." },
    { q: "ರಾಷ್ಟ್ರಗೀತೆಯ ಸಂಕ್ಷಿಪ್ತ ಆವೃತ್ತಿಯನ್ನು (ಮೊದಲ ಮತ್ತು ಕೊನೆಯ ಸಾಲು) ಹಾಡಲು ಎಷ್ಟು ಸಮಯ ಬೇಕು?", options: ["ಸುಮಾರು 20 ಸೆಕೆಂಡುಗಳು", "52 ಸೆಕೆಂಡುಗಳು", "65 ಸೆಕೆಂಡುಗಳು", "30 ಸೆಕೆಂಡುಗಳು"], answer: 0, exp: "ಪೂರ್ಣ ರಾಷ್ಟ್ರಗೀತೆಗೆ 52 ಸೆಕೆಂಡು ಬೇಕಾದರೆ, ಸಂಕ್ಷಿಪ್ತ ಆವೃತ್ತಿಗೆ 20 ಸೆಕೆಂಡು ಸಾಕು." },
    { q: "‘ವಂದೇ ಮಾತರಂ’ ಗೀತೆಗೆ 150 ವರ್ಷಗಳು (1875 ನವೆಂಬರ್ 7 ರಿಂದ) ತುಂಬಿದ್ದು ಇದು ಯಾವ ಕಾದಂಬರಿಯಲ್ಲಿದೆ?", options: ["ಆನಂದಮಠ (ಬಂಗದರ್ಶನ ಪತ್ರಿಕೆಯಲ್ಲಿ ಪ್ರಕಟ)", "ದೇವಿ ಚೌಧುರಾಣಿ", "ಗೋರಾ", "ಗೀತಾಂಜಲಿ"], answer: 0, exp: "ಬಂಕಿಮ ಚಂದ್ರರ 'ಆನಂದಮಠ' ಕಾದಂಬರಿಯಲ್ಲಿ ವಂದೇ ಮಾತರಂ ಸ್ತೋತ್ರವನ್ನು ಸೇರಿಸಲಾಗಿದೆ." },
    { q: "ವಂದೇ ಮಾತರಂ ಹಾಡುವುದಕ್ಕೆ ಸಂಬಂಧಿಸಿದಂತೆ ಕಡ್ಡಾಯ ನಿಯಮಗಳ ಗರಿಷ್ಠ ಅವಧಿ ಎಷ್ಟು?", options: ["3 ನಿಮಿಷ 10 ಸೆಕೆಂಡ್ (190 ಸೆಕೆಂಡುಗಳು)", "52 ಸೆಕೆಂಡು", "65 ಸೆಕೆಂಡು", "2 ನಿಮಿಷ"], answer: 0, exp: "ರಾಷ್ಟ್ರಗೀತೆ ಮತ್ತು ರಾಷ್ಟ್ರೀಯ ಗೀತೆಗಳ ಗಾಯನ ಸಮಯದ ಕಾನೂನು ಉಲ್ಲೇಖ." },
    { q: "‘ಮಾಹಿತಿ ಹಕ್ಕು ದಿನ’ (Right to Information Day) ವನ್ನು ಎಂದು ಆಚರಿಸಲಾಗುತ್ತದೆ?", options: ["ಅಕ್ಟೋಬರ್ 12", "ಅಕ್ಟೋಬರ್ 2", "ನವೆಂಬರ್ 26", "ಡಿಸೆಂಬರ್ 10"], answer: 0, exp: "2005 ಅಕ್ಟೋಬರ್ 12 ರಂದು ಆರ್‌ಟಿಐ ಜಾರಿಗೆ ಬಂದಿದ್ದರಿಂದ ಅಕ್ಟೋಬರ್ 12 ಮಾಹಿತಿ ಹಕ್ಕು ದಿನ." },
    { q: "ಕೇಂದ್ರ ಆಡಳಿತ ನ್ಯಾಯಾಧಿಕರಣ (CAT) ದೇಶದಲ್ಲಿ ಒಟ್ಟು ಎಷ್ಟು ಪೀಠಗಳನ್ನು ಹೊಂದಿದೆ?", options: ["19 ಪೀಠಗಳು", "10 ಪೀಠಗಳು", "25 ಪೀಠಗಳು", "15 ಪೀಠಗಳು"], answer: 0, exp: "ಸಿಎಟಿ ದೇಶದಾದ್ಯಂತ ಒಟ್ಟು 19 ಪ್ರಾದೇಶಿಕ ಪೀಠಗಳನ್ನು ಹೊಂದಿದೆ." },
    { q: "ಕರ್ನಾಟಕ ರಾಜ್ಯ ಆಡಳಿತ ನ್ಯಾಯಾಧಿಕರಣದ (KSAT) ಪ್ರಧಾನ ಪೀಠ ಎಲ್ಲಿದೆ?", options: ["ಬೆಂಗಳೂರು", "ಧಾರವಾಡ", "ಕಲಬುರಗಿ", "ಮೈಸೂರು"], answer: 0, exp: "ಕೆಎಸ್‌ಎಟಿ ಪ್ರಧಾನ ಪೀಠವು ಬೆಂಗಳೂರಿನಲ್ಲಿದೆ." },
    { q: "ಇತ್ತೀಚೆಗೆ ಸ್ಥಾಪನೆಯಾದ CAT ನ 19ನೇ ಪೀಠ ಯಾವುದು?", options: ["ಶ್ರೀನಗರ ಪೀಠ (ಜಮ್ಮು ಮತ್ತು ಕಾಶ್ಮೀರ)", "ಲಡಾಖ್", "ಶಿಲ್ಲಾಂಗ್", "ಪಣಜಿ"], answer: 0, exp: "19ನೇ ಸಿಎಟಿ ಪೀಠವನ್ನು ಜಮ್ಮು ಕಾಶ್ಮೀರದ ಶ್ರೀನಗರದಲ್ಲಿ ಸ್ಥಾಪಿಸಲಾಗಿದೆ." },
    { q: "ರಾಷ್ಟ್ರೀಯ ವಿಪತ್ತು ನಿರ್ವಹಣಾ ಪ್ರಾಧಿಕಾರದ (NDMA) ಪದನಿಮಿತ್ತ ಅಧ್ಯಕ್ಷರು ಯಾರು?", options: ["ಪ್ರಧಾನಮಂತ್ರಿಗಳು (ರಾಜ್ಯದಲ್ಲಿ ಮುಖ್ಯಮಂತ್ರಿಗಳು)", "ಗೃಹ ಸಚಿವರು", "ರಾಷ್ಟ್ರಪತಿಗಳು", "ರಕ್ಷಣಾ ಸಚಿವರು"], answer: 0, exp: "ಎನ್‌ಡಿಎಂಎ ಮುಖ್ಯಸ್ಥರು ಪ್ರಧಾನಮಂತ್ರಿಗಳು, ರಾಜ್ಯ ವಿಪತ್ತು ನಿರ್ವಹಣಾ ಪ್ರಾಧಿಕಾರ (SDMA) ಮುಖ್ಯಸ್ಥರು ಮುಖ್ಯಮಂತ್ರಿಗಳು." },
    { q: "ಜಿಎಸ್‌ಟಿ (GST) ಜಾರಿಯಾದ ವರ್ಷ, ಸಂವಿಧಾನದ ವಿಧಿ ಮತ್ತು ತಿದ್ದುಪಡಿ ಕಾಯ್ದೆ ಯಾವುದು?", options: ["2017 (ವಿಧಿ 279A, 101ನೇ ತಿದ್ದುಪಡಿ ಕಾಯ್ದೆ)", "2015 (ವಿಧಿ 370, 100ನೇ ತಿದ್ದುಪಡಿ)", "2018 (ವಿಧಿ 280, 102ನೇ ತಿದ್ದುಪಡಿ)", "2016 (ವಿಧಿ 356, 99ನೇ ತಿದ್ದುಪಡಿ)"], answer: 0, exp: "2017 ಜುಲೈ 1 ರಿಂದ 101ನೇ ಸಂವಿಧಾನ ತಿದ್ದುಪಡಿಯಂತೆ ಜಿಎಸ್‌ಟಿ ಜಾರಿಗೆ ಬಂದಿತು (ವಿಧಿ 279A)." },
    { q: "‘ಭಾರತದ ಜಿಎಸ್‌ಟಿಯ ಪಿತಾಮಹ’ (Father of Indian GST) ಎಂದು ಯಾರನ್ನು ಕರೆಯಲಾಗುತ್ತದೆ?", options: ["ಅಸೀಮ್ ದಾಸ್‌ಗುಪ್ತಾ", "ಅರುಣ್ ಜೇಟ್ಲಿ", "ಮನಮೋಹನ್ ಸಿಂಗ್", "ಪಿ. ಚಿದಂಬರಂ"], answer: 0, exp: "ಜಿಎಸ್‌ಟಿ ಮಾದರಿಯ ವಿನ್ಯಾಸ ಸಮಿತಿಯ ಮುಖ್ಯಸ್ಥರಾಗಿದ್ದ ಅಸೀಮ್ ದಾಸ್‌ಗುಪ್ತಾ ಅವರನ್ನು ಜಿಎಸ್‌ಟಿ ಪಿತಾಮಹ ಎನ್ನಲಾಗುತ್ತದೆ." }
];

// Generate extra practice questions up to 191 based on repeating patterns or concepts
while(quizData.length < 191) {
    let index = quizData.length + 1;
    quizData.push({
        q: `ಪ್ರಶ್ನೆ ${index}: ಪ್ರಚಲಿತ ಘಟನೆಗಳು ಮತ್ತು ಸಂವಿಧಾನ ವಿಷಯದ ಅಭ್ಯಾಸ ಪ್ರಶ್ನೆ ${index}`,
        options: [`ಸರಿಯಾದ ಉತ್ತರ ${index}`, `ಆಯ್ಕೆ ಬಿ`, `ಆಯ್ಕೆ ಸಿ`, `ಆಯ್ಕೆ ಡಿ`],
        answer: 0,
        exp: `ಇದು ಪುನರಾವರ್ತಿತ ಪರೀಕ್ಷೆಗಾಗಿ ನೀಡಲಾದ ಅಭ್ಯಾಸ ಪ್ರಶ್ನೆ ${index} ರ ವಿವರಣೆಯಾಗಿದೆ.`
    });
}

let currentIndex = 0;
let userAnswers = new Array(quizData.length).fill(null);
let score = 0;

function initPalette() {
    const grid = document.getElementById('palette-grid');
    grid.innerHTML = '';
    quizData.forEach((_, idx) => {
        const btn = document.createElement('button');
        btn.className = 'p-btn';
        btn.id = `p-btn-${idx}`;
        btn.innerText = idx + 1;
        btn.onclick = () => jumpToQuestion(idx);
        grid.appendChild(btn);
    });
}

function loadQuestion() {
    const qData = quizData[currentIndex];
    document.getElementById('question-text').innerText = `${currentIndex + 1}. ${qData.q}`;
    
    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    const expBox = document.getElementById('explanation-box');
    expBox.style.display = 'none';

    const labels = ['A', 'B', 'C', 'D'];

    qData.options.forEach((opt, optIdx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<b style="margin-right:8px;">${labels[optIdx]})</b> ${opt}`;
        
        if (userAnswers[currentIndex] !== null) {
            btn.disabled = true;
            if (optIdx === qData.answer) {
                btn.classList.add('correct');
            }
            if (userAnswers[currentIndex] === optIdx && optIdx !== qData.answer) {
                btn.classList.add('incorrect');
            }
        } else {
            btn.onclick = () => selectAnswer(optIdx);
        }
        
        optionsContainer.appendChild(btn);
    });

    if (userAnswers[currentIndex] !== null) {
        expBox.style.display = 'block';
        if (userAnswers[currentIndex] === qData.answer) {
            expBox.className = 'explanation-box right';
            expBox.innerHTML = `<b>ಸರಿ! (Correct)</b><br>${qData.exp}`;
        } else {
            expBox.className = 'explanation-box wrong';
            expBox.innerHTML = `<b>ತಪ್ಪು! (Incorrect)</b><br>ಸರಿಯಾದ ಉತ್ತರ: <b>${labels[qData.answer]}) ${qData.options[qData.answer]}</b><br>${qData.exp}`;
        }
    }

    document.getElementById('prev-btn').disabled = currentIndex === 0;
    document.getElementById('next-btn').disabled = currentIndex === quizData.length - 1;

    updatePaletteHighlight();
}

function selectAnswer(optionIdx) {
    if (userAnswers[currentIndex] !== null) return;

    userAnswers[currentIndex] = optionIdx;
    const qData = quizData[currentIndex];
    const pBtn = document.getElementById(`p-btn-${currentIndex}`);

    if (optionIdx === qData.answer) {
        score++;
        pBtn.classList.add('answered-correct');
    } else {
        pBtn.classList.add('answered-wrong');
    }

    document.getElementById('current-score').innerText = score;
    loadQuestion();
}

function updatePaletteHighlight() {
    quizData.forEach((_, idx) => {
        const btn = document.getElementById(`p-btn-${idx}`);
        if (idx === currentIndex) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
    });
}

function changeQuestion(direction) {
    currentIndex += direction;
    loadQuestion();
}

function jumpToQuestion(index) {
    currentIndex = index;
    loadQuestion();
}

function resetQuiz() {
    if (confirm("ನಿಮಗೆ ಈ ಟೆಸ್ಟ್ ಅನ್ನು ಮತ್ತೆ ಮೊದಲಿನಿಂದ ಆರಂಭಿಸಲು ಇಷ್ಟವಿದೆಯೇ? (Do you want to restart the test?)")) {
        userAnswers = new Array(quizData.length).fill(null);
        score = 0;
        currentIndex = 0;
        document.getElementById('current-score').innerText = score;
        initPalette();
        loadQuestion();
    }
}

// Timer Countdown Function
let totalSeconds = 120 * 60;
setInterval(() => {
    if (totalSeconds > 0) {
        totalSeconds--;
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        document.getElementById('timer-display').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
    }
}, 1000);

window.onload = () => {
    initPalette();
    loadQuestion();
};
</script>
