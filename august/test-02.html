function generateQuizData() {
    return rawData.map((item, index) => {
        const parts = item.split(". ");
        const qNum = parts[0];
        const content = parts.slice(1).join(". ");
        
        let questionText = "";
        let correctAnswer = "";
        let wrongAnswers = [];

        if (content.includes(":")) {
            const splitContent = content.split(":");
            questionText = splitContent[0].trim() + " ಎಂದರೇನು/ಯಾರು?";
            correctAnswer = splitContent[1].trim();
        } else {
            questionText = `ಪಾಯಿಂಟ್ ${qNum} ಗೆ ಸಂಬಂಧಿಸಿದ ಸರಿಯಾದ ಮಾಹಿತಿ ಯಾವುದು?`;
            correctAnswer = content.trim();
        }

        wrongAnswers = [
            "ಮೇಲಿನ ಯಾವುದೂ ಅಲ್ಲ",
            "ಇದು ಸಂವಿಧಾನದ 370ನೇ ವಿಧಿಗೆ ಸಂಬಂಧಿಸಿದೆ",
            "ಇದು ಕೇವಲ ಕೇಂದ್ರ ಸರ್ಕಾರಕ್ಕೆ ಮಾತ್ರ ಅನ್ವಯಿಸುತ್ತದೆ"
        ];

        let options = [correctAnswer, ...wrongAnswers];
        options.sort(() => Math.random() - 0.5);

        return {
            id: index + 1,
            question: `${qNum}. ${questionText}`,
            options: options,
            correct: correctAnswer,
            fullText: content
        };
    });
}

const quizData = generateQuizData();
let score = 0;
let answeredQuestions = new Set();

function renderQuiz() {
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';

    quizData.forEach((q) => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'quiz-item';
        itemDiv.id = `q-${q.id}`;

        const qTitle = document.createElement('div');
        qTitle.className = 'question';
        qTitle.innerText = q.question;
        itemDiv.appendChild(qTitle);

        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options';

        q.options.forEach((opt) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(q.id, opt, q.correct, btn);
            optionsDiv.appendChild(btn);
        });

        itemDiv.appendChild(optionsDiv);

        const expDiv = document.createElement('div');
        expDiv.className = 'explanation';
        expDiv.id = `exp-${q.id}`;
        expDiv.innerHTML = `<strong>ಸರಿಯಾದ ಮಾಹಿತಿ:</strong> ${q.fullText}`;
        itemDiv.appendChild(expDiv);

        container.appendChild(itemDiv);
    });
}

function checkAnswer(qId, selectedOpt, correctOpt, btnElement) {
    if (answeredQuestions.has(qId)) return;
    answeredQuestions.add(qId);

    const parentDiv = document.getElementById(`q-${qId}`);
    const buttons = parentDiv.querySelectorAll('.option-btn');
    const expDiv = document.getElementById(`exp-${qId}`);

    buttons.forEach(b => b.disabled = true);

    if (selectedOpt === correctOpt) {
        btnElement.classList.add('correct');
        score++;
        document.getElementById('score').innerText = score;
    } else {
        btnElement.classList.add('wrong');
        buttons.forEach(b => {
            if (b.innerText === correctOpt) {
                b.classList.add('correct');
            }
        });
    }
    expDiv.style.display = 'block';
}

function resetQuiz() {
    score = 0;
    answeredQuestions.clear();
    document.getElementById('score').innerText = score;
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Initialize Quiz on page load
renderQuiz();
