<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karnataka PC & SSC Exam Mock Test - Spardha Vijetha June 2026</title>
    <style>
        :root {
            --primary-blue: #003366;
            --secondary-blue: #0066cc;
            --success-green: #28a745;
            --danger-red: #dc3545;
            --light-bg: #f4f7fa;
            --border-color: #dcdcdc;
            --text-dark: #2c3e50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif, 'Tunga', 'Kedage';
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--light-bg);
            color: var(--text-dark);
        }

        body {
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--primary-blue);
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--secondary-blue);
            flex-shrink: 0;
            height: 60px;
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .header-info {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .timer-box {
            background: #ffffff;
            color: #d9534f;
            padding: 4px 12px;
            font-weight: bold;
            border-radius: 4px;
            border: 1px solid #d9534f;
            font-size: 1.05rem;
        }

        .app-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 60px);
            overflow: hidden;
            position: relative;
        }

        .main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            height: 100%;
            overflow: hidden;
        }

        .page-header {
            background: #e9ecef;
            padding: 8px 20px;
            font-weight: bold;
            font-size: 0.95rem;
            color: var(--primary-blue);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .question-scroll-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            min-height: 0;
        }

        .q-text {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #111;
            line-height: 1.5;
        }

        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-item {
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            display: flex;
            align-items: center;
            font-size: 0.95rem;
        }

        .option-item:hover {
            background-color: #f0f4f8;
            border-color: var(--secondary-blue);
        }

        .option-item input[type="radio"] {
            margin-right: 12px;
            transform: scale(1.2);
            cursor: pointer;
        }

        .option-item.correct {
            background-color: #d4edda !important;
            border-color: var(--success-green) !important;
            color: #155724;
            font-weight: 600;
        }

        .option-item.incorrect {
            background-color: #f8d7da !important;
            border-color: var(--danger-red) !important;
            color: #721c24;
        }

        .feedback-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 5px;
            display: none;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .feedback-box.correct {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .feedback-box.incorrect {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .footer-controls {
            padding: 10px 20px;
            background: #e9ecef;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            height: 55px;
        }

        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary { background-color: var(--secondary-blue); color: white; }
        .btn-secondary { background-color: #6c757d; color: white; }
        .btn-danger { background-color: var(--danger-red); color: white; }

        .sidebar {
            width: 320px;
            background: #f8f9fa;
            border-left: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            flex-shrink: 0;
        }

        .palette-header {
            padding: 10px;
            background: #e2e6ea;
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
            text-align: center;
            font-size: 0.95rem;
            flex-shrink: 0;
        }

        .score-board {
            padding: 10px;
            background: #ffffff;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
            flex-shrink: 0;
        }

        .palette-container {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            min-height: 0;
        }

        .palette-group-title {
            font-size: 0.8rem;
            font-weight: bold;
            color: #555;
            margin: 10px 0 5px 0;
            text-transform: uppercase;
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        .btn-qnum {
            height: 36px;
            border: 1px solid var(--border-color);
            background: #ffffff;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
        }

        .btn-qnum.active {
            border: 2px solid var(--primary-blue);
            box-shadow: 0 0 5px rgba(0,51,102,0.4);
        }

        .btn-qnum.answered-correct {
            background-color: var(--success-green);
            color: white;
            border-color: var(--success-green);
        }

        .btn-qnum.answered-wrong {
            background-color: var(--danger-red);
            color: white;
            border-color: var(--danger-red);
        }

        .palette-footer {
            padding: 12px;
            border-top: 1px solid var(--border-color);
            background: #ffffff;
            flex-shrink: 0;
            display: flex;
            gap: 8px;
        }

        .answer-key-section {
            display: none;
            padding: 20px;
            background: #ffffff;
            height: 100%;
            overflow-y: auto;
            flex: 1;
        }

        .answer-key-item {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .answer-key-item strong {
            color: var(--primary-blue);
        }

        @media (max-width: 768px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; height: 220px; }
            .main-panel { height: calc(100% - 220px); }
        }
    </style>
</head>
<body>

    <header>
        <h1>Karnataka PC & SSC CBT Exam Mock Test (Spardha Vijetha June 2026)</h1>
        <div class="header-info">
            <span>Time Left:</span>
            <div class="timer-box" id="timer">30:00</div>
        </div>
    </header>

    <div class="app-container">
        <div class="main-panel" id="quizPanel">
            <div class="page-header" id="pageTitle">Cover Page Questions</div>
            
            <div class="question-scroll-area">
                <div class="q-text" id="questionText">Loading Question...</div>
                <ul class="options-list" id="optionsList"></ul>
                <div class="feedback-box" id="feedbackBox"></div>
            </div>

            <div class="footer-controls">
                <button class="btn btn-secondary" id="prevBtn" onclick="navigate(-1)">Previous</button>
                <button class="btn btn-danger" onclick="resetQuiz()">Retest / Refresh</button>
                <button class="btn btn-primary" id="nextBtn" onclick="navigate(1)">Next</button>
            </div>
        </div>

        <div class="main-panel answer-key-section" id="answerKeyPanel">
            <h2>Answer Key & Explanations (ಉತ್ತರಗಳು ಮತ್ತು ವಿವರಣೆ)</h2>
            <br>
            <div id="answerKeyContent"></div>
            <br>
            <button class="btn btn-primary" onclick="toggleAnswerKey(false)">Back to Test</button>
        </div>

        <div class="sidebar">
            <div class="palette-header">Question Palette</div>
            <div class="score-board">
                Score: <span id="score">0</span> / <span id="totalQuestions">0</span>
            </div>
            <div class="palette-container" id="paletteContainer"></div>
            <div class="palette-footer">
                <button class="btn btn-danger" style="flex:1;" onclick="resetQuiz()">Retest</button>
                <button class="btn btn-primary" style="flex:1;" onclick="toggleAnswerKey(true)">Answer Key</button>
            </div>
        </div>
    </div>

                options: ["A) ವಿಶ್ವ ಪತ್ರಿಕಾ ಸ್ವಾತಂತ್ರ್ಯ ದಿನ", "B) ವಿಶ್ವ ರೆಡ್ ಕ್ರಾಸ್ ದಿನ", "C) ರಾಷ್ಟ್ರೀಯ ತಂತ್ರಜ್ಞಾನ ದಿನ", "D) ವಿಶ್ವ ತಂಬಾಕು ರಹಿತ ದಿನ"],
                correct: 0,

                options: ["A) ಅಂತರರಾಷ್ಟ್ರೀಯ ಜೀವ ವೈವಿಧ್ಯತೆ ದಿನ", "B) ರಾಷ್ಟ್ರೀಯ ತಂತ್ರಜ್ಞಾನ ದಿನ", "C) ಭಯೋತ್ಪಾದನಾ ವಿರೋಧಿ ದಿನ", "D) ವಿಶ್ವ ತಂಬಾಕು ರಹಿತ ದಿನ"],
                correct: 0,
                explanation: "ಮೇ 22 ರಂದು 'ಅಂತರರಾಷ್ಟ್ರೀಯ ಜೀವ ವೈವಿಧ್ಯತೆ ದಿನ'ವನ್ನು ಆಚರಿಸಲಾಗುತ್ತದೆ."
            },
            {
                id: 34,
                page: "Page 1",
                question: "ಮೇ 31 ರಂದು ಆಚರಿಸಲಾಗುವ ಆರೋಗ್ಯ ಸಂಬಂಧಿತ ದಿನ ಯಾವುದು?",
                options: ["A) ವಿಶ್ವ ತಂಬಾಕು ರಹಿತ ದಿನ", "B) ವಿಶ್ವ ಪರಿಸರ ದಿನ", "C) ವಿಶ್ವ ಆರೋಗ್ಯ ದಿನ", "D) ವಿಶ್ವ ಮಲೇರಿಯಾ ದಿನ"],
                correct: 0,
                explanation: "ಮೇ 31 ರಂದು 'ವಿಶ್ವ ತಂಬಾಕು ರಹಿತ ದಿನ' (World No Tobacco Day) ವನ್ನು ಆಚರಿಸಲಾಗುತ್ತದೆ."
            }
        ];

        let currentIndex = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let currentScore = 0;
        let timerInterval = null;
        let secondsLeft = 30 * 60;

        const questionText = document.getElementById("questionText");
        const optionsList = document.getElementById("optionsList");
        const feedbackBox = document.getElementById("feedbackBox");
        const pageTitle = document.getElementById("pageTitle");
        const paletteContainer = document.getElementById("paletteContainer");
        const scoreDisplay = document.getElementById("score");
        const totalQuestionsDisplay = document.getElementById("totalQuestions");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const timerDisplay = document.getElementById("timer");

        function startApp() {
            totalQuestionsDisplay.textContent = quizData.length;
            renderPalette();
            loadQuestion(0);
            initTimer();
            buildAnswerKey();
        }

        function renderPalette() {
            paletteContainer.innerHTML = "";
            let currentGroup = "";
            let currentGrid = null;

            quizData.forEach((item, idx) => {
                if (item.page !== currentGroup) {
                    currentGroup = item.page;
                    const groupHeader = document.createElement("div");
                    groupHeader.className = "palette-group-title";
                    groupHeader.textContent = currentGroup;
                    paletteContainer.appendChild(groupHeader);

                    currentGrid = document.createElement("div");
                    currentGrid.className = "palette-grid";
                    paletteContainer.appendChild(currentGrid);
                }

                const btn = document.createElement("button");
                btn.className = "btn-qnum";
                btn.id = `palette-btn-${idx}`;
                btn.textContent = idx + 1;
                btn.onclick = () => jumpToQuestion(idx);
                currentGrid.appendChild(btn);
            });
        }

        function loadQuestion(index) {
            currentIndex = index;
            const item = quizData[index];

            pageTitle.textContent = `${item.page} - Question ${index + 1} of ${quizData.length}`;
            questionText.textContent = `${index + 1}. ${item.question}`;
            
            optionsList.innerHTML = "";
            feedbackBox.style.display = "none";

            const existingAnswer = userAnswers[index];

            item.options.forEach((optText, optIdx) => {
                const li = document.createElement("li");
                li.className = "option-item";

                const isSelected = existingAnswer !== null && existingAnswer.selected === optIdx;

                if (existingAnswer !== null) {
                    if (optIdx === item.correct) {
                        li.classList.add("correct");
                    } else if (isSelected && optIdx !== item.correct) {
                        li.classList.add("incorrect");
                    }
                }

                li.innerHTML = `
                    <input type="radio" name="option" value="${optIdx}" ${isSelected ? "checked" : ""} ${existingAnswer !== null ? "disabled" : ""}>
                    <span>${optText}</span>
                `;

                if (existingAnswer === null) {
                    li.onclick = () => selectOption(optIdx);
                }

                optionsList.appendChild(li);
            });

            if (existingAnswer !== null) {
                feedbackBox.style.display = "block";
                if (existingAnswer.isCorrect) {
                    feedbackBox.className = "feedback-box correct";
                    feedbackBox.innerHTML = `<strong>ಸರಿ! (Correct)</strong><br>${item.explanation}`;
                } else {
                    feedbackBox.className = "feedback-box incorrect";
                    feedbackBox.innerHTML = `<strong>ತಪ್ಪು! (Incorrect)</strong><br>ಸರಿಯಾದ ಉತ್ತರ: <strong>${item.options[item.correct]}</strong><br>${item.explanation}`;
                }
            }

            document.querySelectorAll(".btn-qnum").forEach((btn, i) => {
                btn.classList.toggle("active", i === index);
            });

            prevBtn.disabled = index === 0;
            nextBtn.disabled = index === quizData.length - 1;
        }

        function selectOption(optIdx) {
            const item = quizData[currentIndex];
            const isCorrect = optIdx === item.correct;

            userAnswers[currentIndex] = {
                selected: optIdx,
                isCorrect: isCorrect
            };

            if (isCorrect) currentScore++;
            scoreDisplay.textContent = currentScore;

            const paletteBtn = document.getElementById(`palette-btn-${currentIndex}`);
            if (isCorrect) {
                paletteBtn.classList.add("answered-correct");
            } else {
                paletteBtn.classList.add("answered-wrong");
            }

            loadQuestion(currentIndex);
        }

        function navigate(dir) {
            const nextIdx = currentIndex + dir;
            if (nextIdx >= 0 && nextIdx < quizData.length) {
                loadQuestion(nextIdx);
            }
        }

        function jumpToQuestion(idx) {
            loadQuestion(idx);
        }

        function initTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsLeft--;
                let m = Math.floor(secondsLeft / 60);
                let s = secondsLeft % 60;
                timerDisplay.textContent = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;

                if (secondsLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("Time expired! Your Score: " + currentScore + "/" + quizData.length);
                }
            }, 1000);
        }

        // Complete Reset/Retest Handler
        function resetQuiz() {
            if (confirm("ಪರೀಕ್ಷೆಯನ್ನು ಮತ್ತೆ ಪ್ರಾರಂಭಿಸಲು ಇಷ್ಟಪಡುತ್ತೀರಾ? (Reset/Retest all questions?)")) {
                userAnswers = new Array(quizData.length).fill(null);
                currentScore = 0;
                scoreDisplay.textContent = "0";
                secondsLeft = 30 * 60;

                document.querySelectorAll(".btn-qnum").forEach(btn => {
                    btn.className = "btn-qnum";
                });

                toggleAnswerKey(false);
                loadQuestion(0);
                initTimer();
            }
        }

        function toggleAnswerKey(show) {
            document.getElementById("quizPanel").style.display = show ? "none" : "flex";
            document.getElementById("answerKeyPanel").style.display = show ? "block" : "none";
        }

        function buildAnswerKey() {
            const keyContainer = document.getElementById("answerKeyContent");
            keyContainer.innerHTML = "";

            quizData.forEach((item, idx) => {
                const row = document.createElement("div");
                row.className = "answer-key-item";
                row.innerHTML = `
                    <p><strong>Q${idx + 1} (${item.page}):</strong> ${item.question}</p>
                    <p><strong>ಸರಿಯಾದ ಉತ್ತರ:</strong> ${item.options[item.correct]}</p>
                    <p style="color: #444;"><strong>ವಿವರಣೆ:</strong> ${item.explanation}</p>
                `;
                keyContainer.appendChild(row);
            });
        }

        window.onload = startApp;
    </script>
