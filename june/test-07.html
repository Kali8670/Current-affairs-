<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karnataka PC & SSC Online CBT Practice Test</title>
    <style>
        :root {
            --primary: #003366;
            --secondary: #0066cc;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
            --light-bg: #f4f7fa;
            --border-color: #dcdcdc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif, 'Tunga', 'Kedage';
        }

        body {
            background-color: var(--light-bg);
            color: #333;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* SSC Header */
        header {
            background: var(--primary);
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--secondary);
            flex-shrink: 0;
        }

        header h1 {
            font-size: 1.2rem;
        }

        .header-info {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .timer-box {
            background: #fff;
            color: #d9534f;
            padding: 5px 12px;
            font-weight: bold;
            border-radius: 4px;
            border: 1px solid #d9534f;
            font-size: 1.1rem;
        }

        /* Main Container */
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* Left Content Area */
        .main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 2px solid var(--border-color);
            background: #fff;
            height: 100%;
            overflow: hidden;
        }

        .page-header {
            background: #e9ecef;
            padding: 10px 20px;
            font-weight: bold;
            font-size: 1rem;
            color: var(--primary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .question-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto; /* Independent scrolling for question body */
        }

        .q-text {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #111;
            line-height: 1.5;
        }

        .options-list {
            list-style: none;
        }

        .option-item {
            margin-bottom: 10px;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            font-size: 1rem;
        }

        .option-item:hover {
            background-color: #f0f4f8;
            border-color: var(--secondary);
        }

        .option-item input[type="radio"] {
            margin-right: 12px;
            transform: scale(1.2);
            cursor: pointer;
        }

        /* Feedback States */
        .option-item.correct {
            background-color: #d4edda !important;
            border-color: var(--success) !important;
            color: #155724;
            font-weight: bold;
        }

        .option-item.incorrect {
            background-color: #f8d7da !important;
            border-color: var(--danger) !important;
            color: #721c24;
        }

        .feedback-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 5px;
            display: none;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .feedback-box.correct {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .feedback-box.incorrect {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* Bottom Controls */
        .footer-controls {
            padding: 12px 20px;
            background: #e9ecef;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-primary { background-color: var(--secondary); color: white; }
        .btn-secondary { background-color: #6c757d; color: white; }
        .btn-danger { background-color: var(--danger); color: white; }

        /* Right Palette Sidebar */
        .sidebar {
            width: 320px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .palette-header {
            padding: 12px;
            background: #e2e6ea;
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
            text-align: center;
            flex-shrink: 0;
        }

        .score-board {
            padding: 10px;
            background: #fff;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
            flex-shrink: 0;
        }

        .palette-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto; /* Independent scrolling for question palette */
        }

        .palette-group-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: #555;
            margin: 10px 0 5px 0;
            text-transform: uppercase;
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .btn-qnum {
            height: 38px;
            border: 1px solid var(--border-color);
            background: #fff;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .btn-qnum.active {
            border: 2px solid var(--primary);
            box-shadow: 0 0 5px rgba(0,51,102,0.5);
        }

        .btn-qnum.answered-correct {
            background-color: var(--success);
            color: white;
            border-color: var(--success);
        }

        .btn-qnum.answered-wrong {
            background-color: var(--danger);
            color: white;
            border-color: var(--danger);
        }

        .palette-footer {
            padding: 15px;
            border-top: 1px solid var(--border-color);
            background: #fff;
            flex-shrink: 0;
        }

        /* Toggle Answer Key View */
        .answer-key-section {
            display: none;
            padding: 20px;
            background: #fff;
            height: 100%;
            overflow-y: auto;
        }

        .answer-key-item {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .answer-key-item strong {
            color: var(--primary);
        }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; height: 200px; }
            .main-panel { height: calc(100% - 200px); }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Karnataka PC & SSC CBT Exam Mock Test</h1>
        <div class="header-info">
            <span>Time Remaining:</span>
            <div class="timer-box" id="timer">15:00</div>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="container">

        <div class="main-panel" id="quizPanel">

                <ul class="options-list" id="optionsList">

                <div class="feedback-box" id="feedbackBox"></div>
            </div>

            <div class="footer-controls">
                <button class="btn btn-secondary" id="prevBtn" onclick="navigate(-1)">Previous</button>
                <button class="btn btn-danger" onclick="resetQuiz()">Reset Test</button>
                <button class="btn btn-primary" id="nextBtn" onclick="navigate(1)">Next</button>
            </div>
        </div>

        <!-- Answer Key Panel (Hidden by Default) -->
        <div class="main-panel answer-key-section" id="answerKeyPanel">
            <h2>Answer Key & Explanations (ಉತ್ತರಗಳು ಮತ್ತು ವಿವರಣೆ)</h2>
            <br>
            <div id="answerKeyContent"></div>
            <br>
            <button class="btn btn-primary" onclick="toggleAnswerKey(false)">Back to Quiz</button>
        </div>

        <!-- Right Side Palette -->
        <div class="sidebar">
            <div class="palette-header">Question Palette</div>
            
            <div class="score-board">
                Score: <span id="score">0</span> / <span id="totalQuestions">0</span>
            </div>

            <div class="palette-container" id="paletteContainer">
                <!-- Grouped question buttons generated by JavaScript -->
            </div>

            <div class="palette-footer">
                <button class="btn btn-primary" style="width: 100%;" onclick="toggleAnswerKey(true)">View Answer Key</button>
            </div>
        </div>
    </div>

                options: [

                options: [
                    "A) ಡಾ. ಅಶೋಕ್ ಕುಮಾರ್ ಲಾಹಿರಿ",
                    "B) ಸುಹಾನ್ ಬರಿಯಾರ್",
                    "C) ರಾಜೀವ್ ಕುಮಾರ್",
                    "D) ಅರವಿಂದ್ ಪನಗಾರಿಯಾ"

                correct: 0,
                explanation: "ಖ್ಯಾತ ಅರ್ಥಶಾಸ್ತ್ರಜ್ಞ ಡಾ. ಅಶೋಕ್ ಕುಮಾರ್ ಲಾಹಿರಿ ಅವರು ನೀತಿ ಆಯೋಗದ ನೂತನ ಉಪಾಧ್ಯಕ್ಷರಾಗಿ ನೇಮಕಗೊಂಡಿದ್ದಾರೆ."
            }
        ];

        // Quiz State Management
        let currentQuestionIndex = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let score = 0;
        let timerInterval;
        let timeRemaining = 15 * 60; // 15 Minutes

        // DOM Elements
        const questionTextEl = document.getElementById("questionText");
        const optionsListEl = document.getElementById("optionsList");
        const feedbackBoxEl = document.getElementById("feedbackBox");
        const pageTitleEl = document.getElementById("pageTitle");
        const paletteContainerEl = document.getElementById("paletteContainer");
        const scoreEl = document.getElementById("score");
        const totalQuestionsEl = document.getElementById("totalQuestions");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const timerEl = document.getElementById("timer");

        // Initialize Test
        function initQuiz() {
            totalQuestionsEl.textContent = quizData.length;
            renderPalette();
            loadQuestion(0);
            startTimer();
            generateAnswerKey();
        }

        // Render Question Palette grouped by Page
        function renderPalette() {
            paletteContainerEl.innerHTML = "";
            let currentGroup = "";
            let gridEl = null;

            quizData.forEach((item, index) => {
                if (item.page !== currentGroup) {
                    currentGroup = item.page;
                    const groupTitle = document.createElement("div");
                    groupTitle.className = "palette-group-title";
                    groupTitle.textContent = currentGroup;
                    paletteContainerEl.appendChild(groupTitle);

                    gridEl = document.createElement("div");
                    gridEl.className = "palette-grid";
                    paletteContainerEl.appendChild(gridEl);
                }

                const btn = document.createElement("button");
                btn.className = "btn-qnum";
                btn.id = `palette-btn-${index}`;
                btn.textContent = index + 1;
                btn.onclick = () => jumpToQuestion(index);
                gridEl.appendChild(btn);
            });
        }

        // Load Question Data
        function loadQuestion(index) {
            currentQuestionIndex = index;
            const data = quizData[index];

            pageTitleEl.textContent = `${data.page} - Question ${index + 1} of ${quizData.length}`;
            questionTextEl.textContent = `${index + 1}. ${data.question}`;
            
            optionsListEl.innerHTML = "";
            feedbackBoxEl.style.display = "none";

            const userAnswer = userAnswers[index];

            data.options.forEach((optText, optIdx) => {
                const li = document.createElement("li");
                li.className = "option-item";

                const isChecked = userAnswer !== null && userAnswer.selected === optIdx;
                
                // Active state styling if answered
                if (userAnswer !== null) {
                    if (optIdx === data.correct) {
                        li.classList.add("correct");
                    } else if (isChecked && optIdx !== data.correct) {
                        li.classList.add("incorrect");
                    }
                }

                li.innerHTML = `
                    <input type="radio" name="opt" value="${optIdx}" ${isChecked ? "checked" : ""} ${userAnswer !== null ? "disabled" : ""}>
                    <span>${optText}</span>
                `;

                if (userAnswer === null) {
                    li.onclick = () => handleOptionSelect(optIdx);
                }

                optionsListEl.appendChild(li);
            });

            // Show explanation feedback if already answered
            if (userAnswer !== null) {
                feedbackBoxEl.style.display = "block";
                if (userAnswer.isCorrect) {
                    feedbackBoxEl.className = "feedback-box correct";
                    feedbackBoxEl.innerHTML = `<strong>ಸರಿ! (Correct)</strong><br>${data.explanation}`;
                } else {
                    feedbackBoxEl.className = "feedback-box incorrect";
                    feedbackBoxEl.innerHTML = `<strong>ತಪ್ಪು! (Incorrect)</strong><br>ಸರಿಯಾದ ಉತ್ತರ: <strong>${data.options[data.correct]}</strong><br>${data.explanation}`;
                }
            }

            // Update Palette Active Class
            document.querySelectorAll(".btn-qnum").forEach((btn, i) => {
                btn.classList.toggle("active", i === index);
            });

            // Handle Navigation Buttons
            prevBtn.disabled = index === 0;
            nextBtn.disabled = index === quizData.length - 1;
        }

        // Option Selection Handler
        function handleOptionSelect(selectedIdx) {
            const data = quizData[currentQuestionIndex];
            const isCorrect = selectedIdx === data.correct;

            userAnswers[currentQuestionIndex] = {
                selected: selectedIdx,
                isCorrect: isCorrect
            };

            if (isCorrect) score += 1;
            scoreEl.textContent = score;

            // Update Palette Button Style
            const btn = document.getElementById(`palette-btn-${currentQuestionIndex}`);
            if (isCorrect) {
                btn.classList.add("answered-correct");
            } else {
                btn.classList.add("answered-wrong");
            }

            // Reload current question to display feedback
            loadQuestion(currentQuestionIndex);
        }

        // Navigation
        function navigate(direction) {
            const newIndex = currentQuestionIndex + direction;
            if (newIndex >= 0 && newIndex < quizData.length) {
                loadQuestion(newIndex);
            }
        }

        function jumpToQuestion(index) {
            loadQuestion(index);
        }

        // Timer Function
        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeRemaining--;
                let m = Math.floor(timeRemaining / 60);
                let s = timeRemaining % 60;
                timerEl.textContent = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;

                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    alert("Time is up! Your score: " + score);
                }
            }, 1000);
        }

        // Reset Quiz
        function resetQuiz() {
            if (confirm("ನಿಮಗೆ ರಿಸೆಟ್ ಮಾಡಲು ಖಚಿತವಿದೆಯೇ? (Are you sure you want to reset the test?)")) {
                userAnswers = new Array(quizData.length).fill(null);
                score = 0;
                scoreEl.textContent = "0";
                timeRemaining = 15 * 60;
                
                document.querySelectorAll(".btn-qnum").forEach(btn => {
                    btn.classList.remove("answered-correct", "answered-wrong");
                });

                toggleAnswerKey(false);
                loadQuestion(0);
                startTimer();
            }
        }

        // Toggle Answer Key View
        function toggleAnswerKey(show) {
            document.getElementById("quizPanel").style.display = show ? "none" : "flex";
            document.getElementById("answerKeyPanel").style.display = show ? "block" : "none";
        }

        // Generate Answer Key List
        function generateAnswerKey() {
            const container = document.getElementById("answerKeyContent");
            container.innerHTML = "";

            quizData.forEach((item, idx) => {
                const itemDiv = document.createElement("div");
                itemDiv.className = "answer-key-item";
                itemDiv.innerHTML = `
                    <p><strong>Q${idx + 1} (${item.page}):</strong> ${item.question}</p>
                    <p><strong>ಉತ್ತರ (Answer):</strong> ${item.options[item.correct]}</p>
                    <p style="color: #555;"><strong>ವಿವರಣೆ:</strong> ${item.explanation}</p>
                `;
                container.appendChild(itemDiv);
            });
        }

        // Run Init
        window.onload = initQuiz;
    </script>
