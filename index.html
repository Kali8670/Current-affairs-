<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CURRENT AFFAIRS PORTAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --neon-green: #00e676;
            --neon-green-glow: rgba(0, 230, 118, 0.35);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 230, 118, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(15, 23, 42, 0.5) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .app-header {
            text-align: center;
            padding: 40px 20px 20px 20px;
        }

        .title-main {
            color: var(--neon-green);
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 0 15px var(--neon-green-glow);
            margin-bottom: 4px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .container {
            max-width: 500px;
            margin: 20px auto 0 auto;
            padding: 0 16px;
        }

        .grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 50px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text-main);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .card:hover, .card:active {
            background: var(--neon-green);
            border-color: var(--neon-green);
            color: #000;
            box-shadow: 0 0 20px var(--neon-green-glow);
            transform: translateY(-2px);
        }

        .card-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .card-icon {
            font-size: 1.2rem;
        }

        .card-info h2 {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .arrow-icon {
            font-size: 1.2rem;
            color: var(--text-muted);
            transition: transform 0.3s ease;
        }

        .card:hover .arrow-icon {
            color: #000;
            transform: translateX(4px);
        }

        .back-btn {
            display: inline-block;
            color: var(--neon-green);
            background: transparent;
            border: 1px solid var(--neon-green);
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: var(--neon-green);
            color: #000;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <h1 class="title-main" id="header-title">CURRENT AFFAIRS</h1>
        <p class="subtitle" id="header-subtitle">SELECT MONTH TO PRACTICE</p>
    </header>
    
    <main class="container">
        <button id="back-btn" class="back-btn hidden" onclick="showMonths()">← BACK TO MONTHS</button>
        <section id="month-list" class="grid"></section>
        <section id="test-list" class="grid hidden"></section>
    </main>

    <script>
        const monthData = {
            "JANUARY": 10,
            "FEBRUARY": 12,
            "MARCH": 15,
            "APRIL": 15,
            "MAY": 15,
            "JUNE": 15,
            "JULY": 15,
            "AUGUST": 15,
            "SEPTEMBER": 15,
            "OCTOBER": 15,
            "NOVEMBER": 15,
            "DECEMBER": 15
        };

        const monthListEl = document.getElementById("month-list");
        const testListEl = document.getElementById("test-list");
        const headerTitle = document.getElementById("header-title");
        const headerSubtitle = document.getElementById("header-subtitle");
        const backBtn = document.getElementById("back-btn");

        function renderMonths() {
            monthListEl.innerHTML = "";
            Object.keys(monthData).forEach(month => {
                const card = document.createElement("a");
                card.className = "card";
                card.onclick = () => openMonth(month);
                card.innerHTML = `
                    <div class="card-info">
                        <span class="card-icon">📅</span>
                        <h2>${month}</h2>
                    </div>
                    <span class="arrow-icon">→</span>
                `;
                monthListEl.appendChild(card);
            });
        }

        function openMonth(monthName) {
            headerTitle.innerText = monthName;
            headerSubtitle.innerText = "SELECT TEST SERIES";
            
            monthListEl.classList.add("hidden");
            testListEl.classList.remove("hidden");
            backBtn.classList.remove("hidden");

            const folder = monthName.toLowerCase();
            testListEl.innerHTML = "";

            const totalTests = monthData[monthName] || 0;

            for (let i = 1; i <= totalTests; i++) {
                const testNum = i.toString().padStart(2, '0');
                const testCard = document.createElement("a");
                testCard.className = "card";
                testCard.href = `${folder}/test-${testNum}.html`;
                testCard.innerHTML = `
                    <div class="card-info">
                        <span class="card-icon">📝</span>
                        <h2>TEST SERIES ${testNum}</h2>
                    </div>
                    <span class="arrow-icon">→</span>
                `;
                testListEl.appendChild(testCard);
            }
        }

        function showMonths() {
            headerTitle.innerText = "CURRENT AFFAIRS";
            headerSubtitle.innerText = "SELECT MONTH TO PRACTICE";
            
            monthListEl.classList.remove("hidden");
            testListEl.classList.add("hidden");
            backBtn.classList.add("hidden");
        }

        renderMonths();
    </script>
</body>
</html>
