<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CURRENT AFFAIRS PORTAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(0, 230, 118, 0.3);
            --neon-green: #00e676;
            --neon-green-glow: rgba(0, 230, 118, 0.35);
            --neon-green-subtle-glow: rgba(0, 230, 118, 0.15);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --expired-red: #ff3366;
            --expired-red-glow: rgba(255, 51, 102, 0.4);
            --expired-red-flicker: rgba(255, 51, 102, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 230, 118, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(15, 23, 42, 0.5) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .app-header {
            text-align: center;
            padding: 40px 20px 20px 20px;
        }

        .title-main {
            color: var(--neon-green);
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 0 15px var(--neon-green-glow);
            margin-bottom: 4px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .container {
            max-width: 500px;
            margin: 20px auto 0 auto;
            padding: 0 16px;
        }

        .grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Default Card Styling with Neon Glow */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 50px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text-main);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 0 12px var(--neon-green-subtle-glow);
        }

        /* Glowing Month Boxes */
        #month-list .card {
            border-color: rgba(0, 230, 118, 0.5);
            box-shadow: 0 0 15px var(--neon-green-glow);
        }

        /* Test Series Boxes (Light Glow) */
        #test-list .card {
            border-color: rgba(0, 230, 118, 0.25);
            box-shadow: 0 0 8px var(--neon-green-subtle-glow);
        }

        .card:hover, .card:active {
            background: var(--neon-green);
            border-color: var(--neon-green);
            color: #000;
            box-shadow: 0 0 25px var(--neon-green-glow);
            transform: translateY(-2px);
        }

        .card-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .card-icon {
            font-size: 1.2rem;
        }

        .card-info h2 {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Glowing Badge Styles */
        .card-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge-count {
            background: rgba(0, 230, 118, 0.15);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 0 10px var(--neon-green-glow);
            transition: all 0.3s ease;
        }

        .card:hover .badge-count {
            background: #000;
            color: var(--neon-green);
            border-color: #000;
            box-shadow: none;
        }

        /* Expired Month Card Styles */
        .card.expired {
            border-color: rgba(255, 51, 102, 0.4) !important;
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.2) !important;
        }

        .card.expired:hover {
            background: var(--card-bg);
            border-color: var(--expired-red) !important;
            color: var(--text-main);
            box-shadow: 0 0 18px var(--expired-red-glow) !important;
            transform: translateY(-2px);
        }

        .badge-expired {
            background: rgba(255, 51, 102, 0.15);
            color: var(--expired-red);
            border: 1px solid var(--expired-red);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1px;
            box-shadow: 0 0 12px var(--expired-red-glow);
        }

        .card.expired:hover .arrow-icon {
            color: var(--expired-red);
            transform: translateX(4px);
        }

        /* Flickering Medium-Level Glow Animation for Expired Test Card */
        @keyframes mediumFlickerGlow {
            0%, 100% {
                box-shadow: 0 0 12px var(--expired-red-glow);
                border-color: var(--expired-red);
            }
            50% {
                box-shadow: 0 0 4px var(--expired-red-flicker);
                border-color: rgba(255, 51, 102, 0.3);
            }
        }

        .expired-notice-card {
            background: rgba(255, 51, 102, 0.05) !important;
            border: 1px solid var(--expired-red) !important;
            color: var(--expired-red) !important;
            justify-content: center !important;
            text-align: center;
            cursor: default !important;
            animation: mediumFlickerGlow 2.2s infinite ease-in-out;
        }

        .expired-notice-card:hover {
            background: rgba(255, 51, 102, 0.05) !important;
            color: var(--expired-red) !important;
            transform: none !important;
        }

        .arrow-icon {
            font-size: 1.2rem;
            color: var(--text-muted);
            transition: transform 0.3s ease;
        }

        .card:hover .arrow-icon {
            color: #000;
            transform: translateX(4px);
        }

        .back-btn {
            display: inline-block;
            color: var(--neon-green);
            background: transparent;
            border: 1px solid var(--neon-green);
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px var(--neon-green-subtle-glow);
        }

        .back-btn:hover {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 15px var(--neon-green-glow);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <h1 class="title-main" id="header-title">CURRENT AFFAIRS</h1>
        <p class="subtitle" id="header-subtitle">SELECT MONTH TO PRACTICE</p>
    </header>
    
    <main class="container">
        <button id="back-btn" class="back-btn hidden" onclick="showMonths()">← BACK TO MONTHS</button>
        <section id="month-list" class="grid"></section>
        <section id="test-list" class="grid hidden"></section>
    </main>

    <script>
        const monthData = {
            "JANUARY": 10,
            "FEBRUARY": 12,
            "MARCH": 0,
            "APRIL": 1,
            "MAY": 2,
            "JUNE": 12,
            "JULY": 2,
            "AUGUST": 2,
            "SEPTEMBER": 0,
            "OCTOBER": 0,
            "NOVEMBER": 0,
            "DECEMBER": 0
        };

        const monthListEl = document.getElementById("month-list");
        const testListEl = document.getElementById("test-list");
        const headerTitle = document.getElementById("header-title");
        const headerSubtitle = document.getElementById("header-subtitle");
        const backBtn = document.getElementById("back-btn");

        function renderMonths() {
            monthListEl.innerHTML = "";
            Object.keys(monthData).forEach(month => {
                const count = monthData[month];
                const card = document.createElement("a");
                card.onclick = () => openMonth(month);
                
                if (count === 0) {
                    card.className = "card expired";
                    card.innerHTML = `
                        <div class="card-info">
                            <span class="card-icon">📅</span>
                            <h2>${month}</h2>
                        </div>
                        <div class="card-right">
                            <span class="badge-expired">EXPIRED</span>
                            <span class="arrow-icon">→</span>
                        </div>
                    `;
                } else {
                    card.className = "card";
                    card.innerHTML = `
                        <div class="card-info">
                            <span class="card-icon">📅</span>
                            <h2>${month}</h2>
                        </div>
                        <div class="card-right">
                            <span class="badge-count">TOTAL ${count}</span>
                            <span class="arrow-icon">→</span>
                        </div>
                    `;
                }
                
                monthListEl.appendChild(card);
            });
        }

        function openMonth(monthName) {
            headerTitle.innerText = monthName;
            headerSubtitle.innerText = "SELECT TEST SERIES";
            
            monthListEl.classList.add("hidden");
            testListEl.classList.remove("hidden");
            backBtn.classList.remove("hidden");

            const folder = monthName.toLowerCase();
            testListEl.innerHTML = "";

            const totalTests = monthData[monthName] || 0;

            if (totalTests === 0) {
                const noticeCard = document.createElement("div");
                noticeCard.className = "card expired-notice-card";
                noticeCard.innerHTML = `
                    <div class="card-info">
                        <span class="card-icon">⚠️</span>
                        <h2>TEST SERIES OF THIS MONTH ARE EXPIRED</h2>
                    </div>
                `;
                testListEl.appendChild(noticeCard);
            } else {
                for (let i = 1; i <= totalTests; i++) {
                    const testNum = i.toString().padStart(2, '0');
                    const testCard = document.createElement("a");
                    testCard.className = "card";
                    testCard.href = `${folder}/test-${testNum}.html`;
                    testCard.innerHTML = `
                        <div class="card-info">
                            <span class="card-icon">📝</span>
                            <h2>TEST SERIES ${testNum}</h2>
                        </div>
                        <span class="arrow-icon">→</span>
                    `;
                    testListEl.appendChild(testCard);
                }
            }
        }

        function showMonths() {
            headerTitle.innerText = "CURRENT AFFAIRS";
            headerSubtitle.innerText = "SELECT MONTH TO PRACTICE";
            
            monthListEl.classList.remove("hidden");
            testListEl.classList.add("hidden");
            backBtn.classList.add("hidden");
        }

        renderMonths();
    </script>
</body>
</html>
