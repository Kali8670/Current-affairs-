// Map questions and build options dynamically with prefixes A), B), C), D)
let masterQuizData = rawQuestions.map((item, index) => {
  const correctIdx = item.options.indexOf(item.correctText);
  const prefixes = ["A) ", "B) ", "C) ", "D) "];
  return {
    originalIndex: index + 1,
    q: item.q,
    options: item.options.map((opt, i) => prefixes[i] + opt),
    correct: correctIdx,
    exp: item.exp
  };
});

// State Management
let currentQuizData = [...masterQuizData];
let currentIndex = 0;
let userAnswers = new Array(masterQuizData.length).fill(null);
let wrongTestCounter = 1;

function initQuiz() {
  document.getElementById('total-q').innerText = currentQuizData.length;
  renderPalette();
  loadQuestion(currentIndex);
}

function renderPalette() {
  const palette = document.getElementById('palette');
  palette.innerHTML = '';
  
  currentQuizData.forEach((qData, index) => {
    const origIndex = qData.originalIndex;
    const btn = document.createElement('button');
    btn.className = `palette-btn ${index === currentIndex ? 'active' : ''}`;
    
    // Original Number Preservation
    btn.innerText = origIndex;
    
    // Global answer state tracking
    const ans = userAnswers[origIndex - 1];
    if (ans !== null) {
      if (ans === masterQuizData[origIndex - 1].correct) {
        btn.classList.add('answered-correct');
      } else {
        btn.classList.add('answered-incorrect');
      }
    }
    
    btn.onclick = () => jumpToQuestion(index);
    palette.appendChild(btn);
  });
}

function loadQuestion(index) {
  if (currentQuizData.length === 0) return;
  
  const qData = currentQuizData[index];
  const origIndex = qData.originalIndex;
  
  document.getElementById('question-text').innerText = qData.q;
  
  const optionsContainer = document.getElementById('options-container');
  optionsContainer.innerHTML = '';
  
  const expContainer = document.getElementById('explanation-container');
  expContainer.innerHTML = '';

  const ans = userAnswers[origIndex - 1];
  const isAnswered = ans !== null;

  qData.options.forEach((opt, optIdx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerText = opt;

    if (isAnswered) {
      btn.disabled = true;
      if (optIdx === qData.correct) {
        btn.classList.add('show-correct');
      }
      if (ans === optIdx) {
        if (optIdx === qData.correct) {
          btn.classList.add('selected-correct');
        } else {
          btn.classList.add('selected-incorrect');
        }
      }
    } else {
      btn.onclick = () => selectOption(optIdx);
    }

    optionsContainer.appendChild(btn);
  });

  if (isAnswered) {
    const isCorrect = ans === qData.correct;
    expContainer.innerHTML = `
      <div class="explanation-box show ${isCorrect ? 'correct' : 'incorrect'}">
        <h4>${isCorrect ? 'ಸರಿಯಾದ ಉತ್ತರ!' : 'ತಪ್ಪು (Incorrect)'}</h4>
        <p><b>ಸರಿಯಾದ ಉತ್ತರ:</b> ${qData.options[qData.correct]}</p>
        <p style="margin-top:5px;"><b>ವಿವರಣೆ:</b> ${qData.exp}</p>
      </div>
    `;
  }

  document.getElementById('prev-btn').disabled = index === 0;
  document.getElementById('next-btn').disabled = index === currentQuizData.length - 1;
  
  renderPalette();
  updateScore();
}

function selectOption(optionIndex) {
  const origIndex = currentQuizData[currentIndex].originalIndex;
  userAnswers[origIndex - 1] = optionIndex;
  loadQuestion(currentIndex);
}

function jumpToQuestion(index) {
  currentIndex = index;
  loadQuestion(currentIndex);
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    loadQuestion(currentIndex);
  }
}

function nextQuestion() {
  if (currentIndex < currentQuizData.length - 1) {
    currentIndex++;
    loadQuestion(currentIndex);
  }
}

function updateScore() {
  const score = userAnswers.reduce((acc, ans, idx) => {
    return ans === masterQuizData[idx].correct ? acc + 1 : acc;
  }, 0);
  document.getElementById('score').innerText = score;
}

/* Functional Requirements: Action Buttons */
function retestAll() {
  userAnswers = new Array(masterQuizData.length).fill(null);
  currentQuizData = [...masterQuizData];
  currentIndex = 0;
  wrongTestCounter = 1;
  
  document.getElementById('test-title').innerText = "Karnataka PC & SSC CBT Test Series (April 2026 - Part 1)";
  document.getElementById('total-q').innerText = masterQuizData.length;
  
  initQuiz();
}

function testWrongAnswers() {
  const wrongQuestions = masterQuizData.filter((q) => {
    const ans = userAnswers[q.originalIndex - 1];
    return ans !== null && ans !== q.correct;
  });

  if (wrongQuestions.length === 0) {
    alert("There are no wrong answers to test!");
    return;
  }

  wrongQuestions.forEach((q) => {
    userAnswers[q.originalIndex - 1] = null;
  });

  currentQuizData = wrongQuestions;
  currentIndex = 0;

  document.getElementById('test-title').innerText = `Wrong Test-${wrongTestCounter}`;
  wrongTestCounter++;

  document.getElementById('total-q').innerText = currentQuizData.length;
  initQuiz();
}

window.onload = initQuiz;
</script>
