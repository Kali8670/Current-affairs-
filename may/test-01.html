let currentQuizData = [];
let currentIndex = 0;
let userAnswers = [];
let wrongTestCounter = 1;

// Helper function to shuffle options using Fisher-Yates Shuffle
function shuffleArray(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Prepare question data with jumbled options
function prepareQuestionData(questions) {
  return questions.map(qObj => {
    const shuffledOptions = shuffleArray(qObj.options);
    const correctIdx = shuffledOptions.indexOf(qObj.correctText);
    return {
      originalIndex: qObj.originalIndex,
      q: qObj.q,
      options: shuffledOptions,
      correct: correctIdx,
      correctText: qObj.correctText,
      exp: qObj.exp
    };
  });
}

function initQuiz() {
  currentQuizData = prepareQuestionData(originalQuizData);
  userAnswers = new Array(currentQuizData.length).fill(null);
  currentIndex = 0;
  wrongTestCounter = 1;
  document.getElementById('test-title').innerText = "Karnataka PC & SSC CBT Exam Mock Test (May 2026 Edition)";
  document.getElementById('total-questions').innerText = currentQuizData.length;
  renderPalette();
  loadQuestion(currentIndex);
}

function renderPalette() {
  const palette = document.getElementById('palette');
  palette.innerHTML = '';
  currentQuizData.forEach((qObj, index) => {
    const btn = document.createElement('button');
    btn.className = `palette-btn ${index === currentIndex ? 'active' : ''}`;
    // Always preserve and show original global question number
    btn.innerText = qObj.originalIndex;
    
    if (userAnswers[index] !== null) {
      if (userAnswers[index] === qObj.correct) {
        btn.classList.add('answered-correct');
      } else {
        btn.classList.add('answered-incorrect');
      }
    }
    
    btn.onclick = () => jumpToQuestion(index);
    palette.appendChild(btn);
  });
}

function loadQuestion(index) {
  const qData = currentQuizData[index];
  document.getElementById('question-text').innerText = qData.q;
  
  const optionsContainer = document.getElementById('options-container');
  optionsContainer.innerHTML = '';
  
  const expContainer = document.getElementById('explanation-container');
  expContainer.innerHTML = '';

  const isAnswered = userAnswers[index] !== null;

  qData.options.forEach((opt, optIdx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerText = opt;

    if (isAnswered) {
      btn.disabled = true;
      if (optIdx === qData.correct) {
        btn.classList.add('show-correct');
      }
      if (userAnswers[index] === optIdx) {
        if (optIdx === qData.correct) {
          btn.classList.add('selected-correct');
        } else {
          btn.classList.add('selected-incorrect');
        }
      }
    } else {
      btn.onclick = () => selectOption(optIdx);
    }

    optionsContainer.appendChild(btn);
  });

  if (isAnswered) {
    const isCorrect = userAnswers[index] === qData.correct;
    expContainer.innerHTML = `
      <div class="explanation-box ${isCorrect ? 'correct' : ''}">
        <h4>${isCorrect ? 'ಸರಿಯಾದ ಉತ್ತರ!' : 'ತಪ್ಪು (Incorrect)'}</h4>
        <p><b>ಸರಿಯಾದ ಉತ್ತರ:</b> ${qData.options[qData.correct]}</p>
        <p style="margin-top:5px;"><b>ವಿವರಣೆ:</b> ${qData.exp}</p>
      </div>
    `;
  }

  document.getElementById('prev-btn').disabled = index === 0;
  document.getElementById('next-btn').disabled = index === currentQuizData.length - 1;
  
  renderPalette();
  updateScore();
}

function selectOption(optionIndex) {
  userAnswers[currentIndex] = optionIndex;
  loadQuestion(currentIndex);
}

function jumpToQuestion(index) {
  currentIndex = index;
  loadQuestion(currentIndex);
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    loadQuestion(currentIndex);
  }
}

function nextQuestion() {
  if (currentIndex < currentQuizData.length - 1) {
    currentIndex++;
    loadQuestion(currentIndex);
  }
}

function updateScore() {
  const score = userAnswers.reduce((acc, ans, idx) => {
    return ans === currentQuizData[idx].correct ? acc + 1 : acc;
  }, 0);
  document.getElementById('score').innerText = score;
}

function retestAll() {
  initQuiz();
}

function testWrongAnswers() {
  const wrongQuestions = [];
  
  currentQuizData.forEach((qData, idx) => {
    if (userAnswers[idx] !== null && userAnswers[idx] !== qData.correct) {
      const origItem = originalQuizData.find(o => o.originalIndex === qData.originalIndex);
      if (origItem) wrongQuestions.push(origItem);
    }
  });

  if (wrongQuestions.length === 0) {
    alert("No wrong answers found! Excellent job.");
    return;
  }

  currentQuizData = prepareQuestionData(wrongQuestions);
  userAnswers = new Array(currentQuizData.length).fill(null);
  currentIndex = 0;
  
  document.getElementById('test-title').innerText = `Karnataka PC & SSC CBT Exam Mock Test (Wrong Test-${wrongTestCounter})`;
  wrongTestCounter++;
  
  document.getElementById('total-questions').innerText = currentQuizData.length;
  renderPalette();
  loadQuestion(currentIndex);
}

window.onload = initQuiz;
</script>

</body>
