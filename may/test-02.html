<script>
// Raw Question Database (Original Questions)
const rawQuizData = [
  { id: 1, q: "1. 'ಸ್ಪರ್ಧಾ ವಿಜೇತ' ಮೇ 2026 ರ ಸಂಚಿಕೆ ಪ್ರಕಾರ ರಾಜ್ಯಸಭೆಯ ಉಪಸಭಾಪತಿಯಾಗಿ ಯಾರು ಮರು ಆಯ್ಕೆಯಾಗಿದ್ದಾರೆ?", options: ["ಹರಿವಂಶ ನಾರಾಯಣಸಿಂಗ್", "ಜಗದೀಪ್ ಧನಕರ್", "ಮಲ್ಲಿಕಾರ್ಜುನ ಖರ್ಗೆ", "ಎಂ. ವೆಂಕಯ್ಯ ನಾಯ್ಡು"], correct: 0, exp: "ರಾಜ್ಯಸಭೆಯ ಉಪಸಭಾಪತಿ ಹುದ್ದೆಗೆ 'ಹರಿವಂಶ ನಾರಾಯಣಸಿಂಗ್' ಅವರು ಪುನರಾಯ್ಕೆಯಾಗಿದ್ದಾರೆ." },
  { id: 2, q: "2. ಹಿಂದೂಸ್ತಾನ್ ಏರೋನಾಟಿಕ್ಸ್ ಲಿಮಿಟೆಡ್ (HAL) ನೂತನ ಅಧ್ಯಕ್ಷರಾಗಿ ನೇಮಕಗೊಂಡ ಕನ್ನಡಿಗ ಯಾರು?", options: ["ರವಿ ಕೋಟ", "ಸಿ. ಬಿ. ಅನಂತಕೃಷ್ಣನ್", "ಆರ್. ಮಾಧವನ್", "ಕೆ. ಶಿವನ್"], correct: 0, exp: "ಕನ್ನಡಿಗರಾದ 'ರವಿ ಕೋಟ' ಅವರು ಹೆಚ್‌ಎಎಲ್ (HAL) ಸಂಸ್ಥೆಯ ಹೊಸ ಅಧ್ಯಕ್ಷರಾಗಿ ನೇಮಕಗೊಂಡಿದ್ದಾರೆ." },
  { id: 3, q: "3. ಕಳೆದ 125 ವರ್ಷಗಳ ಇತಿಹಾಸದಲ್ಲೇ ಮೊದಲ ಬಾರಿಗೆ ಆಸ್ಟ್ರೇಲಿಯಾ ಸೇನೆಗೆ ನೇಮಕಗೊಂಡ ಪ್ರಥಮ ಮಹಿಳಾ ಮುಖ್ಯಸ್ಥರು ಯಾರು?", options: ["ಲೆಫ್ಟಿನೆಂಟ್ ಜನರಲ್ ಸುಸಾನ್ ಕೊಯ್ಸ್", "ಕೆಪ್ಟನ್ ಆನ್ ಆಂಡರ್ಸನ್", "ಆಂಜೆಲಾ ಮೆರ್ಕೆಲ್", "ಮಾರ್ಗರೇಟ್ ಠಾಚರ್"], correct: 0, exp: "ಆಸ್ಟ್ರೇಲಿಯಾ ಸಶಸ್ತ್ರ ಪಡೆಗಳ 125 ವರ್ಷಗಳ ಇತಿಹಾಸದಲ್ಲಿ 'ಲೆಫ್ಟಿನೆಂಟ್ ಜನರಲ್ ಸುಸಾನ್ ಕೊಯ್ಸ್' ಪ್ರಥಮ ಮಹಿಳಾ ಮುಖ್ಯಸ್ಥರಾಗಿ ಇತಿಹಾಸ ನಿರ್ಮಿಸಿದ್ದಾರೆ." },
  { id: 4, q: "4. ಪಶ್ಚಿಮ ಬಂಗಾಳದ ನೂತನ ಮುಖ್ಯಮಂತ್ರಿಯಾಗಿ ಯಾರು ಅಧಿಕಾರ ವಹಿಸಿಕೊಂಡಿದ್ದಾರೆ?", options: ["ಸುವೇಂದು ಅಧಿಕಾರಿ", "ಮಮತಾ ಬ್ಯಾನರ್ಜಿ", "ಅಭಿಷೇಕ್ ಬ್ಯಾನರ್ಜಿ", "ದಿಲೀಪ್ ಘೋಷ್"], correct: 0, exp: "'ಸುವೇಂದು ಅಧಿಕಾರಿ' ಅವರು ಪಶ್ಚಿಮ ಬಂಗಾಳದ ನೂತನ ಮುಖ್ಯಮಂತ್ರಿಯಾಗಿ ನಿಯೋಜನೆಗೊಂಡಿದ್ದಾರೆ." },
  { id: 5, q: "5. ತಮಿಳುನಾಡಿನ ನೂತನ ಮುಖ್ಯಮಂತ್ರಿಯಾಗಿ ಯಾರು ನೇಮಕಗೊಂಡಿದ್ದಾರೆ?", options: ["ಜೋಸೆಫ್ ವಿಜಯ್", "ಎಂ. ಕೆ. ಸ್ಟಾಲಿನ್", "ಉದಯನಿಧಿ ಸ್ಟಾಲಿನ್", "ಕೆ. ಪಳನಿಸ್ವಾಮಿ"], correct: 0, exp: "ತಮಿಳುನಾಡಿನ ರಾಜಕೀಯ ಬೆಳವಣಿಗೆಯಲ್ಲಿ 'ಜೋಸೆಫ್ ವಿಜಯ್' ನೂತನ ಮುಖ್ಯಮಂತ್ರಿಯಾಗಿ ಆಯ್ಕೆಯಾಗಿದ್ದಾರೆ." },
  { id: 6, q: "6. ಬಿಹಾರ ರಾಜ್ಯದ ನೂತನ ಮುಖ್ಯಮಂತ್ರಿಯಾಗಿ ಯಾರು ಆಯ್ಕೆಯಾಗಿದ್ದಾರೆ?", options: ["ಸಮರ್ಥ್ ಚೌಧರಿ", "ನಿತೀಶ್ ಕುಮಾರ್", "ತೇಜಸ್ವಿ ಯಾದವ್", "ಸಾಮ್ರಾಟ್ ಚೌಧರಿ"], correct: 0, exp: "ಬಿಹಾರ ಸರ್ಕಾರದ ನೂತನ ಮುಖ್ಯಮಂತ್ರಿಯಾಗಿ 'ಸಮರ್ಥ್ ಚೌಧರಿ' ಅವರು ಆಯ್ಕೆಯಾಗಿದ್ದಾರೆ." },
  { id: 7, q: "7. ಬಾಂಗ್ಲಾದೇಶಕ್ಕೆ ಭಾರತದ ನೂತನ ಹೈಕಮಿಷನರ್ ಆಗಿ ಯಾರು ನೇಮಕಗೊಂಡಿದ್ದಾರೆ?", options: ["ದಿನೇಶ್ ತ್ರಿವೇದಿ", "ಪ್ರಣಯ್ ವರ್ಮಾ", "ವಿಕ್ರಮ್ ದೊರೈಸ್ವಾಮಿ", "ಹರ್ಷವರ್ಧನ್ ಶ್ರಿಂಗ್ಲಾ"], correct: 0, exp: "ಬಾಂಗ್ಲಾದೇಶದಲ್ಲಿ ಭಾರತದ ರಾಜತಾಂತ್ರಿಕ ನಿಯೋಗವನ್ನು ಮುನ್ನಡೆಸಲು 'ದಿನೇಶ್ ತ್ರಿವೇದಿ' ಅವರನ್ನು ಹೈಕಮಿಷನರ್ ಆಗಿ ನೇಮಿಸಲಾಗಿದೆ." },
  { id: 8, q: "8. ಪ್ರತಿವರ್ಷ 'ವಿಶ್ವ ಆರೋಗ್ಯ ದಿನ'ವನ್ನು (World Health Day) ಯಾವ ದಿನಾಂಕದಂದು ಆಚರಿಸಲಾಗುತ್ತದೆ?", options: ["ಏಪ್ರಿಲ್ 07", "ಏಪ್ರಿಲ್ 14", "ಏಪ್ರಿಲ್ 22", "ಏಪ್ರಿಲ್ 24"], correct: 0, exp: "ವಿಶ್ವ ಆರೋಗ್ಯ ಸಂಸ್ಥೆಯ (WHO) ಸ್ಥಾಪನೆಯ ನೆನಪಿಗಾಗಿ ಪ್ರತಿವರ್ಷ 'ಏಪ್ರಿಲ್ 07' ರಂದು ವಿಶ್ವ ಆರೋಗ್ಯ ದಿನ ಆಚರಿಸಲಾಗುತ್ತದೆ." },
  { id: 9, q: "9. ಜಾಗತಿಕವಾಗಿ 'ವಿಶ್ವ ಕ್ವಾಂಟಂ ದಿವಸ'ವನ್ನು (World Quantum Day) ಯಾವ ದಿನಾಂಕದಂದು ಆಚರಿಸಲಾಗುತ್ತದೆ?", options: ["ಏಪ್ರಿಲ್ 14", "ಏಪ್ರಿಲ್ 07", "ಏಪ್ರಿಲ್ 21", "ಏಪ್ರಿಲ್ 26"], correct: 0, exp: "ಕ್ವಾಂಟಂ ವಿಜ್ಞಾನ ಮತ್ತು ತಂತ್ರಜ್ಞಾನದ ಜಾಗೃತಿಗಾಗಿ 'ಏಪ್ರಿಲ್ 14' ರಂದು ವಿಶ್ವ ಕ್ವಾಂಟಂ ದಿವಸವನ್ನು ಆಚರಿಸಲಾಗುತ್ತದೆ." },
  { id: 10, q: "10. ಭಾರತದಲ್ಲಿ ಪ್ರತಿವರ್ಷ 'ರಾಷ್ಟ್ರೀಯ ನಾಗರಿಕ ಸೇವಾ ದಿನ'ವನ್ನು (National Civil Services Day) ಯಾವಾಗ ಆಚರಿಸಲಾಗುತ್ತದೆ?", options: ["ಏಪ್ರಿಲ್ 21", "ಏಪ್ರಿಲ್ 24", "ಏಪ್ರಿಲ್ 22", "ಮೇ 01"], correct: 0, exp: "ಆಡಳಿತ ಸೇವೆಯ ಅಧಿಕಾರಿಗಳನ್ನು ಗೌರವಿಸಲು ಭಾರತದಲ್ಲಿ 'ಏಪ್ರಿಲ್ 21' ರಂದು ರಾಷ್ಟ್ರೀಯ ನಾಗರಿಕ ಸೇವಾ ದಿನವನ್ನು ಆಚರಿಸಲಾಗುತ್ತದೆ." },
  { id: 11, q: "11. 'ವಿಶ್ವ ಭೂ/ಪೃಥ್ವಿ ದಿನ'ವನ್ನು (Earth Day) ಜಾಗತಿಕವಾಗಿ ಯಾವ ದಿನಾಂಕದಂದು ಆಚರಿಸಲಾಗುತ್ತದೆ?", options: ["ಏಪ್ರಿಲ್ 22", "ಏಪ್ರಿಲ್ 24", "ಜೂನ್ 05", "ಮಾರ್ಚ್ 22"], correct: 0, exp: "ಪರಿಸರ ಸಂರಕ್ಷಣೆಯ ಮಹತ್ವ ಸಾರಲು ಪ್ರತಿವರ್ಷ 'ಏಪ್ರಿಲ್ 22' ರಂದು ವಿಶ್ವ ಪೃಥ್ವಿ (ಭೂ) ದಿನ ಆಚರಿಸಲಾಗುತ್ತದೆ." },
  { id: 12, q: "12. ಭಾರತದಲ್ಲಿ 'ರಾಷ್ಟ್ರೀಯ ಪಂಚಾಯತ್ ರಾಜ್ ದಿನ'ವನ್ನು ಯಾವ ದಿನಾಂಕದಂದು ಆಚರಿಸಲಾಗುತ್ತದೆ?", options: ["ಏಪ್ರಿಲ್ 24", "ಏಪ್ರಿಲ್ 21", "ಅಕ್ಟೋಬರ್ 02", "ಜನವರಿ 26"], correct: 0, exp: "73ನೇ ಸಂವಿಧಾನ ತಿದ್ದುಪಡಿ ಜಾರಿಗೆ ಬಂದ ನೆನಪಿಗಾಗಿ ಪ್ರತಿವರ್ಷ 'ಏಪ್ರಿಲ್ 24' ರಂದು ರಾಷ್ಟ್ರೀಯ ಪಂಚಾಯತ್ ರಾಜ್ ದಿನ ಆಚರಿಸಲಾಗುತ್ತದೆ." },
  { id: 13, q: "13. 'ಅಂತರರಾಷ್ಟ್ರೀಯ ಬೌದ್ಧಿಕ ಆಸ್ತಿ ದಿನ'ವನ್ನು (World IP Day) ಯಾವಾಗ ಆಚರಿಸಲಾಗುತ್ತದೆ?", options: ["ಏಪ್ರಿಲ್ 26", "ಏಪ್ರಿಲ್ 14", "ಮೇ 10", "ಜೂನ್ 15"], correct: 0, exp: "ಕಾಪಿರೈಟ್, ಪೇಟೆಂಟ್ ಹಾಗೂ ಬೌದ್ಧಿಕ ಆಸ್ತಿ ಹಕ್ಕುಗಳ ಅರಿವಿಗಾಗಿ 'ಏಪ್ರಿಲ್ 26' ರಂದು ಅಂತರರಾಷ್ಟ್ರೀಯ ಬೌದ್ಧಿಕ ಆಸ್ತಿ ದಿನ ಆಚರಿಸಲಾಗುತ್ತದೆ." },
  { id: 14, q: "14. ಶಾಂಘೈ ಸಹಕಾರ ಸಂಘಟನೆಯ (SCO) ರಕ್ಷಣಾ ಸಚಿವರ ಶೃಂಗಸಭೆಯು ಎಲ್ಲಿ ನೆರವೇರಿತು?", options: ["ಬೀಜಿಂಗ್", "ನವದೆಹಲಿ", "ಮಾಸ್ಕೋ", "ತಾಷ್ಕೆಂಟ್"], correct: 0, exp: "SCO ಒಕ್ಕೂಟದ ಸದಸ್ಯ ದೇಶಗಳ ರಕ್ಷಣಾ ಸಚಿವರ ಸಭೆಯು ಚೀನಾದ 'ಬೀಜಿಂಗ್' ನಗರದಲ್ಲಿ ಜರುಗಿತು." },
  { id: 15, q: "15. 'ಬೆಂಗಳೂರು ಹವಾಮಾನ ಶೃಂಗ ಸಮಾವೇಶ-2026' ಎಲ್ಲಿ ನಡೆಯಿತು?", options: ["ಬೆಂಗಳೂರು", "ಮೈಸೂರು", "ಮಂಗಳೂರು", "ಬೆಳಗಾವಿ"], correct: 0, exp: "ಪರಿಸರ ಬದಲಾವಣೆ ಮತ್ತು ಸುಸ್ಥಿರ ಅಭಿವೃದ್ಧಿಯ ಕುರಿತಾದ 'ಹವಾಮಾನ ಶೃಂಗ ಸಮಾವೇಶ-2026' ರಾಜಧಾನಿ ಬೆಂಗಳೂರಿನಲ್ಲಿ ಆಯೋಜನೆಗೊಂಡಿತ್ತು." },
  { id: 16, q: "16. ಜಾಗತಿಕ ವಾಣಿಜ್ಯ ಮತ್ತು ಹಡಗು ಸಂಚಾರದಲ್ಲಿ ಅತ್ಯಂತ ಪ್ರಮುಖ 'ಹೆಬ್ಬಾಗಿಲು'ಗಳಾಗಿ ಕಾರ್ಯನಿರ್ವಹಿಸುವ ಭೂಗೋಳದ ಭಾಗಗಳು ಯಾವುವು?", options: ["ಜಲಸಂಧಿಗಳು (Straits)", "ಪ್ರಸ್ಥಭೂಮಿಗಳು", "ಮರುಭೂಮಿಗಳು", "ದ್ವೀಪಸಮೂಹಗಳು"], correct: 0, exp: "ಅಂತರರಾಷ್ಟ್ರೀಯ ವ್ಯಾಪಾರ ಮತ್ತು ಸಮುದ್ರ ಮಾರ್ಗದ ಶೇ.80ರಷ್ಟು ಸಾರಿಗೆಯು ಜಲಸಂಧಿಗಳ (Straits) ಮೂಲಕವೇ ಸಾಗುತ್ತದೆ." },
  { id: 17, q: "17. ಇತ್ತೀಚೆಗೆ 'ರಾಜ್ಯ ಸ್ಥಾನಮಾನ' ಪಡೆದು 50 ವರ್ಷಗಳ ಸುವರ್ಣ ಮಹೋತ್ಸವ ಆಚರಿಸಿಕೊಂಡ ಭಾರತದ ರಾಜ್ಯ ಯಾವುದು?", options: ["ಸಿಕ್ಕಿಂ", "ಗೋವಾ", "ಮೇಘಾಲಯ", "ಹಿಮಾಚಲ ಪ್ರದೇಶ"], correct: 0, exp: "1975ರಲ್ಲಿ ಭಾರತದ 22ನೇ ರಾಜ್ಯವಾಗಿ ಸೇರ್ಪಡೆಯಾದ 'ಸಿಕ್ಕಿಂ' ತನ್ನ 50ನೇ ವರ್ಷಾಚರಣೆಯನ್ನು ಸಂಭ್ರಮಿಸಿದೆ." },
  { id: 18, q: "18. ಇತ್ತೀಚೆಗೆ ಶ್ರೀ ಗುರು ಭೈರವೇಶ್ವರ ಮಂದಿರ ಉದ್ಘಾಟನೆಗೊಂಡ ಕರ್ನಾಟಕದ ಪ್ರಸಿದ್ಧ ಧಾರ್ಮಿಕ ಕ್ಷೇತ್ರ ಯಾವುದು?", options: ["ಆದಿಚುಂಚನಗಿರಿ", "ಧರ್ಮಸ್ಥಳ", "ಮುರುಡೇಶ್ವರ", "ಕುಕ್ಕೆ ಸುಬ್ರಹ್ಮಣ್ಯ"], correct: 0, exp: "ಮಂಡ್ಯ ಜಿಲ್ಲೆಯ ಪ್ರಸಿದ್ಧ ಕ್ಷೇತ್ರವಾದ 'ಆದಿಚುಂಚನಗಿರಿ'ಯಲ್ಲಿ ನವೀಕೃತ ಶ್ರೀ ಗುರು ಭೈರವೇಶ್ವರ ಮಂದಿರ ಉದ್ಘಾಟನೆಯಾಯಿತು." },
  { id: 19, q: "19. ಗ್ರಾಮೀಣಾಭಿವೃದ್ಧಿಗಾಗಿ ಇಸ್ರೋ (ISRO) ಡಿಜಿಟಲ್ ನಕ್ಷೆಗಳನ್ನು ಒದಗಿಸಲು ರೂಪಿಸಿರುವ ಪೋರ್ಟಲ್ ಯಾವುದು?", options: ["ಗ್ರಾಮ್ ಮುಂಚಿತ್ (Gram Manchitra)", "ಭುವನ್ ಪೋರ್ಟಲ್", "ಇ-ಪಂಚಾಯತ್", "ಡಿಜಿಟಲ್ ಗ್ರಾಮ್"], correct: 0, exp: "ಗ್ರಾಮೀಣ ಪ್ರದೇಶಗಳ ಯೋಜನೆ ಮತ್ತು ಮೂಲಸೌಕರ್ಯ ಅಭಿವೃದ್ಧಿಗೆ ಇಸ್ರೋ ಸಾಫ್ಟ್‌ವೇರ್ ಆಧಾರಿತ 'ಗ್ರಾಮ್ ಮುಂಚಿತ್' ಪೋರ್ಟಲ್ ಒದಗಿಸಿದೆ." },
  { id: 20, q: "20. ರಾಜ್ಯಗಳ ಜಿಡಿಪಿ (GSDP) ಲೆಕ್ಕಾಚಾರ ಮಾಡಲು ಏಕರೂಪದ ಮಾರ್ಗದರ್ಸೂಚಿಯಲ್ಲಿ ಯಾವ ವರ್ಷವನ್ನು 'ಮೂಲ ವರ್ಷ'ವಾಗಿ (Base Year) ಅಳವಡಿಸಲಾಗಿದೆ?", options: ["2022-23", "2011-12", "2018-19", "2020-21"], correct: 0, exp: "ರಾಜ್ಯಗಳ ಜಿಡಿಪಿ ಲೆಕ್ಕಾಚಾರದಲ್ಲಿ ನಿಖರತೆ ತರಲು '2022-23' ರ ಆರ್ಥಿಕ ವರ್ಷವನ್ನು ನೂತನ ಮೂಲ ವರ್ಷವಾಗಿ ನಿಗದಿಪಡಿಸಲಾಗಿದೆ." },
  { id: 21, q: "21. 2026ರ 'ವಿಶ್ವ ಕ್ವಾಂಟಂ ದಿನಾಚರಣೆ'ಯ ಪ್ರಮುಖ ಕಾರ್ಯಕ್ರಮಗಳನ್ನು ಭಾರತದ ಯಾವ ನಗರದಲ್ಲಿ ಆಚರಿಸಲಾಯಿತು?", options: ["ಬೆಂಗಳೂರು", "ಹೈದರಾಬಾದ್", "ಪುಣೆ", "ಚೆನ್ನೈ"], correct: 0, exp: "ಐಟಿ-ಬಿಟಿ ಹಬ್ ಆಗಿರುವ 'ಬೆಂಗಳೂರು' ನಗರದಲ್ಲಿ 2026ರ ವಿಶ್ವ ಕ್ವಾಂಟಂ ದಿನಾಚರಣೆಯ ಉನ್ನತ ಮಟ್ಟದ ಸಮಾವೇಶ ನಡೆಯಿತು." },
  { id: 22, q: "22. ವಿಶೇಷ ಚೇತನರ ಉದ್ಯೋಗಾವಕಾಶ ಹೆಚ್ಚಿಸಲು ಕರ್ನಾಟಕ ಸರ್ಕಾರ ಬಿಡುಗಡೆ ಮಾಡಿದ ಆ್ಯಪ್ ಯಾವುದು?", options: ["ಆದಿತ್ಯಾರ್", "ಸೇವಾನಿಕೇತನ", "ಸಕ್ಷಮ್", "ಸಾಮರ್ಥ್ಯ ಆ್ಯಪ್"], correct: 0, exp: "ವಿಕಲಚೇತನರಿಗೆ ಸೂಕ್ತ ಉದ್ಯೋಗ ಮತ್ತು ತರಬೇತಿ ಮಾಹಿತಿ ನೀಡಲು ಕರ್ನಾಟಕ ಸರ್ಕಾರ 'ಆದಿತ್ಯಾರ್' ಮೊಬೈಲ್ ಅಪ್ಲಿಕೇಷನ್ ತಂದಿದೆ." },
  { id: 23, q: "23. ಭಾರತದ ಕ್ರಾಂತಿಕಾರಿ ಡಿಜಿಟಲ್ ಪಾವತಿ ವ್ಯವಸ್ಥೆಯಾದ 'ಯುಪಿಐ' (UPI) ಜಾರಿಗೆ ಬಂದು ಎಷ್ಟು ವರ್ಷ ಪೂರೈಸಿದೆ?", options: ["ದಶಕ (10 ವರ್ಷಗಳು)", "5 ವರ್ಷಗಳು", "15 ವರ್ಷಗಳು", "20 ವರ್ಷಗಳು"], correct: 0, exp: "2016ರಲ್ಲಿ NPCI ನಿಂದ ಪ್ರಾರಂಭಗೊಂಡ UPI ಪಾವತಿ ವ್ಯವಸ್ಥೆಯು ಯಶಸ್ವಿ 10 ವರ್ಷಗಳನ್ನು (ದಶಕ) ಪೂರೈಸಿದೆ." },
  { id: 24, q: "24. ಉಡುಪಿ ಜಿಲ್ಲೆಯ ಬೈಂದೂರು ಬಳಿಯ ಪೆಂದೂರ್ ಸರ್ಕಾರಿ ಶಾಲೆಯಲ್ಲಿ ಅಳವಡಿಸಲಾದ ಪ್ರಥಮ AI ಶಿಕ್ಷಕಿಯ ಹೆಸರೇನು?", options: ["ಐರಿಸ್ (Iris)", "ಸೋಫಿಯಾ", "ಮಿತ್ರ", "ಸಿಕಂದರ್"], correct: 0, exp: "ಉಡುಪಿಯ ಪೆಂದೂರ್ ಶಾಲೆಯಲ್ಲಿ ವಿದ್ಯಾರ್ಥಿಗಳಿಗೆ ಪಾಠ ಮಾಡಲು 'ಐರಿಸ್' ಎಂಬ ಹೆಸರಿನ ಕೃತಕ ಬುದ್ಧಿಮತ್ತೆ (AI) ರೋಬೋಟ್ ಶಿಕ್ಷಕಿಯನ್ನು ಪರಿಚಯಿಸಲಾಗಿದೆ." },
  { id: 25, q: "25. ಸುಪ್ರೀಂ ಕೋರ್ಟ್‌ನಲ್ಲಿ ನ್ಯಾಯಾಧೀಶರ ಒಟ್ಟು ಸಂಖ್ಯೆಯನ್ನು ಎಷ್ಟು ಹುದ್ದೆಗಳಿಗೆ ಏರಿಸಲು ಪ್ರಸ್ತಾಪಿಸಲಾಗಿದೆ?", options: ["38 ನ್ಯಾಯಾಧೀಶರು", "34 ನ್ಯಾಯಾಧೀಶರು", "40 ನ್ಯಾಯಾಧೀಶರು", "50 ನ್ಯಾಯಾಧೀಶರು"], correct: 0, exp: "ಬಾಕಿ ಪ್ರಕರಣಗಳ ಶೀಘ್ರ ವಿಲೇವಾರಿಗಾಗಿ ಸುಪ್ರೀಂ ಕೋರ್ಟ್ ನ್ಯಾಯಾಧೀಶರ ಸಂಖ್ಯೆಯನ್ನು 38ಕ್ಕೆ ಹೆಚ್ಚಿಸಲು ಮಸೂದೆ ಪ್ರಸ್ತಾಪಿಸಲಾಗಿದೆ." },
  { id: 26, q: "26. ಮಾದಕ ದ್ರವ್ಯ ಮುಕ್ತ ಸಮಾಜ ನಿರ್ಮಾಣಕ್ಕಾಗಿ ಕೇಂದ್ರ ಸರ್ಕಾರ ಜಾರಿಗೆ ತಂದ ತಂತ್ರಜ್ಞಾನ ಯೋಜನೆ ಯಾವುದು?", options: ["ನಶೆ ಮುಕ್ತ ಭಾರತ ಅಭಿಯಾನ 2.0 ಆ್ಯಪ್", "ಸುಗಮ್ಯ ಭಾರತ", "ಸೇವಾ ಸಿಂಧು", "ನಿಕೇತನ ಆ್ಯಪ್"], correct: 0, exp: "ಯುವಜನರಲ್ಲಿ ಜಾಗೃತಿ ಮೂಡಿಸಲು 'ನಶೆ ಮುಕ್ತ ಭಾರತ ಅಭಿಯಾನ 2.0' ಆ್ಯಪ್ ರೂಪಿಸಲಾಗಿದೆ." },
  { id: 27, q: "27. ಇತ್ತೀಚೆಗೆ ಭಾರತವು ಯಾವ ದೇಶದೊಂದಿಗೆ ಐತಿಹಾಸಿಕ ಮುಕ್ತ ವ್ಯಾಪಾರ ಒಪ್ಪಂದಕ್ಕೆ (FTA) ಸಹಿ ಹಾಕಿದೆ?", options: ["ನ್ಯೂಜಿಲ್ಯಾಂಡ್", "ಆಸ್ಟ್ರೇಲಿಯಾ", "ಕೆನಡಾ", "ಜಪಾನ್"], correct: 0, exp: "ದ್ವಿಪಕ್ಷೀಯ ವಾಣಿಜ್ಯ ಹೆಚ್ಚಿಸಲು ಭಾರತ ಮತ್ತು 'ನ್ಯೂಜಿಲ್ಯಾಂಡ್' ದೇಶಗಳ ನಡುವೆ ಮುಕ್ತ ವ್ಯಾಪಾರ ಒಪ್ಪಂದ (FTA) ಕುದುರಿದೆ." },
  { id: 28, q: "28. ತೈಲ ರಫ್ತು ಮಾಡುವ ದೇಶಗಳ ಒಕ್ಕೂಟವಾದ 'ಒಪೆಕ್' (OPEC) ನಿಂದ ಹೊರಬರಲು ನಿರ್ಧರಿಸಿದ ದೇಶ ಯಾವುದು?", options: ["ಯುಎಇ (UAE)", "ಕತಾರ್", "ಅಂಗೋಲಾ", "ಇರಾನ್"], correct: 0, exp: "ತನ್ನ ಸ್ವತಂತ್ರ ತೈಲ ಉತ್ಪಾದನಾ ನೀತಿಗಾಗಿ 'ಸಂಯುಕ್ತ ಅರಬ್ ಎಮಿರೇಟ್ಸ್' (UAE) ಒಪೆಕ್ ಒಕ್ಕೂಟದಿಂದ ಹೊರಬರುವ ತೀರ್ಮಾನ ಮಾಡಿದೆ." },
  { id: 29, q: "29. ಸಾಂಪ್ರದಾಯಿಕ ಕೊಲ್ಲಾಪುರಿ ಚಪ್ಪಲಿ ಬ್ರ್ಯಾಂಡಿಂಗ್ ಮತ್ತು ಮಾರುಕಟ್ಟೆಗಾಗಿ ಬಿಡುಗಡೆ ಮಾಡಿದ ಸಂಸ್ಥೆ ಯಾವುದು?", options: ["ಪ್ವಾಡಾ (PWADA)", "ಕೆಎಸ್‌ಐಡಿಸಿ", "ನಬಾರ್ಡ್", "ಖಾದಿ ಮಂಡಳಿ"], correct: 0, exp: "ಚರ್ಮೋದ್ಯಮ ಮತ್ತು ಕಲೆ ಉತ್ತೇಜಿಸಲು 'ಪ್ವಾಡಾ' ಸಂಸ್ಥೆಯು ಅಧಿಕೃತ ಕೊಲ್ಲಾಪುರಿ ಚಪ್ಪಲಿ ಸರಣಿ ಬಿಡುಗಡೆ ಮಾಡಿದೆ." },
  { id: 30, q: "30. ರಷ್ಯಾದಿಂದ ಭಾರತಕ್ಕೆ ಹಸ್ತಾಂತರಗೊಂಡ S-400 ಕ್ಷಿಪಣಿ ವಾಯು ರಕ್ಷಣಾ ವ್ಯವಸ್ಥೆಯ ಆವೃತ್ತಿ ಯಾವುದು?", options: ["4ನೇ ಘಟಕ (Squadron)", "1ನೇ ಘಟಕ", "3ನೇ ಘಟಕ", "5ನೇ ಘಟಕ"], correct: 0, exp: "ರಷ್ಯಾದಿಂದ ಭಾರತ ಪಡೆದುಕೊಳ್ಳುತ್ತಿರುವ S-400 ಸುಧಾರಿತ ವಾಯು ರಕ್ಷಣಾ ಕ್ಷಿಪಣಿ ವ್ಯವಸ್ಥೆಯ 4ನೇ ಘಟಕ ಭಾರತ ಸೇರಿದೆ." },
  { id: 31, q: "31. ಇತ್ತೀಚೆಗೆ ಅಗಲಿದ ಭಾರತದ ವಿಶ್ವಪ್ರಸಿದ್ಧ ಹಿನ್ನೆಲೆ ಗಾಯಕಿ ಯಾರು?", options: ["ಆಶಾ ಭೋಸ್ಲೆ", "ಲತಾ ಮಂಗೇಷ್ಕರ್", "ಕೆ.ಎಸ್. ಚಿತ್ರಾ", "ಸುಮಿತ್ರಾ ಸೇನ್"], correct: 0, exp: "ಭಾರತೀಯ ಸಂಗೀತ ಲೋಕದ ದಂತಕಥೆ, ಹಿರಿಯ ಗಾಯಕಿ 'ಆಶಾ ಭೋಸ್ಲೆ' ಅವರು ಇತ್ತೀಚೆಗೆ ನಿಧನರಾದರು." },
  { id: 32, q: "32. ಭಾರತೀಯ ಫೋಟೋ ಜರ್ನಲಿಸಂನ ಪಿತಾಮಹ ಎಂದು ಕರೆಯಲ್ಪಡುವ, ಇತ್ತೀಚೆಗೆ ನಿಧನರಾದ ಛಾಯಾಗ್ರಾಹಕ ಯಾರು?", options: ["ರಘು ರಾಯ್", "ರಘುಬೀರ್ ಸಿಂಗ್", "ಹೊಮೈ ವ್ಯಾರಾವಾಲಾ", "ಪ್ರಶಾಂತ್ ಪಂಜಿಯಾರ್"], correct: 0, exp: "ಐಕಾನಿಕ್ ಫೋಟೋಗಳಿಗೆ ಹೆಸರಾದ ಭಾರತೀಯ ಫೋಟೋ ಜರ್ನಲಿಸಂನ ಪಿತಾಮಹ 'ರಘು ರಾಯ್' ನಿಧನರಾದರು." },

// Active Test State
let activeQuestions = [];
let currentIndex = 0;
let userAnswers = [];
let wrongTestCount = 1;

// Helper: Shuffle Array (Fisher-Yates)
function shuffleArray(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Process Question Data with Jumbled Options
function prepareQuestions(data) {
  const prefixes = ["A) ", "B) ", "C) ", "D) "];
  return data.map(item => {
    const originalCorrectText = item.options[item.correct];
    const shuffledTexts = shuffleArray(item.options);
    const newCorrectIdx = shuffledTexts.indexOf(originalCorrectText);
    
    const formattedOptions = shuffledTexts.map((optText, i) => prefixes[i] + optText);
    
    return {
      id: item.id,
      q: item.q,
      options: formattedOptions,
      correct: newCorrectIdx,
      exp: item.exp
    };
  });
}

function initQuiz() {
  activeQuestions = prepareQuestions(rawQuizData);
  userAnswers = new Array(activeQuestions.length).fill(null);
  currentIndex = 0;
  
  document.getElementById('header-title').innerText = "Karnataka PC & SSC CBT Test Series (May 2026 - Part 2)";
  document.getElementById('total-q').innerText = activeQuestions.length;
  
  renderPalette();
  loadQuestion(currentIndex);
}

function renderPalette() {
  const palette = document.getElementById('palette');
  palette.innerHTML = '';
  
  activeQuestions.forEach((item, index) => {
    const btn = document.createElement('button');
    btn.className = `palette-btn ${index === currentIndex ? 'active' : ''}`;
    btn.innerText = item.id; // Preserve Original Question Numbering
    
    if (userAnswers[index] !== null) {
      if (userAnswers[index] === item.correct) {
        btn.classList.add('answered-correct');
      } else {
        btn.classList.add('answered-incorrect');
      }
    }
    
    btn.onclick = () => jumpToQuestion(index);
    palette.appendChild(btn);
  });
}

function loadQuestion(index) {
  const qData = activeQuestions[index];
  document.getElementById('question-text').innerText = qData.q;
  
  const optionsContainer = document.getElementById('options-container');
  optionsContainer.innerHTML = '';
  
  const expContainer = document.getElementById('explanation-container');
  expContainer.innerHTML = '';

  const isAnswered = userAnswers[index] !== null;

  qData.options.forEach((opt, optIdx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerText = opt;

    if (isAnswered) {
      btn.disabled = true;
      if (optIdx === qData.correct) {
        btn.classList.add('show-correct');
      }
      if (userAnswers[index] === optIdx) {
        if (optIdx === qData.correct) {
          btn.classList.add('selected-correct');
        } else {
          btn.classList.add('selected-incorrect');
        }
      }
    } else {
      btn.onclick = () => selectOption(optIdx);
    }

    optionsContainer.appendChild(btn);
  });

  if (isAnswered) {
    const isCorrect = userAnswers[index] === qData.correct;
    expContainer.innerHTML = `
      <div class="explanation-box ${isCorrect ? 'correct' : ''}">
        <h4>${isCorrect ? 'ಸರಿಯಾದ ಉತ್ತರ!' : 'ತಪ್ಪು (Incorrect)'}</h4>
        <p><b>ಸರಿಯಾದ ಉತ್ತರ:</b> ${qData.options[qData.correct]}</p>
        <p style="margin-top:5px;"><b>ವಿವರಣೆ:</b> ${qData.exp}</p>
      </div>
    `;
  }

  document.getElementById('prev-btn').disabled = index === 0;
  document.getElementById('next-btn').disabled = index === activeQuestions.length - 1;
  
  renderPalette();
  updateScore();
}

function selectOption(optionIndex) {
  userAnswers[currentIndex] = optionIndex;
  loadQuestion(currentIndex);
}

function jumpToQuestion(index) {
  currentIndex = index;
  loadQuestion(currentIndex);
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    loadQuestion(currentIndex);
  }
}

function nextQuestion() {
  if (currentIndex < activeQuestions.length - 1) {
    currentIndex++;
    loadQuestion(currentIndex);
  }
}

function updateScore() {
  const score = userAnswers.reduce((acc, ans, idx) => {
    return ans === activeQuestions[idx].correct ? acc + 1 : acc;
  }, 0);
  document.getElementById('score').innerText = score;
}

// Button Feature 1: Retest All
function retestAll() {
  wrongTestCount = 1;
  initQuiz();
}

// Button Feature 2: Test Wrong Answers
function testWrongAnswers() {
  const wrongIndexes = [];
  userAnswers.forEach((ans, idx) => {
    if (ans !== null && ans !== activeQuestions[idx].correct) {
      wrongIndexes.push(idx);
    }
  });

  if (wrongIndexes.length === 0) {
    alert("ಯಾವುದೇ ತಪ್ಪು ಉತ್ತರಗಳಿಲ್ಲ! (No incorrect answers found to practice!)");
    return;
  }

  // Filter raw questions corresponding to wrongly answered ones
  const wrongRawData = wrongIndexes.map(idx => {
    const activeQ = activeQuestions[idx];
    return rawQuizData.find(q => q.id === activeQ.id);
  });

  // Re-shuffle options for wrong questions attempt
  activeQuestions = prepareQuestions(wrongRawData);
  userAnswers = new Array(activeQuestions.length).fill(null);
  currentIndex = 0;

  document.getElementById('header-title').innerText = `Karnataka PC & SSC CBT Test Series (Wrong Test-${wrongTestCount})`;
  document.getElementById('total-q').innerText = activeQuestions.length;
  wrongTestCount++;

  renderPalette();
  loadQuestion(currentIndex);
}

window.onload = initQuiz;
</script>

</body>
