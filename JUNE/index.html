<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karnataka PC & SSC CBT Exam Simulator</title>
    <style>
        :root {
            --primary: #0056b3;
            --primary-dark: #003d80;
            --secondary: #28a745;
            --warning: #ffc107;
            --danger: #dc3545;
            --gray: #6c757d;
            --light: #f8f9fa;
            --dark: #343a40;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Bar */
        header {
            background-color: var(--primary-dark);
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
        }

        header h1 {
            font-size: 1.1rem;
        }

        .timer-box {
            background-color: #ffffff;
            color: #d9534f;
            padding: 5px 15px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.1rem;
            border: 1px solid #d9534f;
        }

        /* Main Container */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* Question Area */
        .quiz-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
            overflow-y: auto; /* Independent Smooth Scroll */
            padding: 20px;
            height: 100%;
        }

        .page-badge {
            background-color: #e3f2fd;
            color: #0d47a1;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
            width: fit-content;
        }

        .question-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #1a1a1a;
            line-height: 1.5;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: #fff;
            border: 2px solid #cecece;
            border-radius: 6px;
            padding: 12px 15px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option-btn:hover {
            background-color: #f0f4f8;
            border-color: var(--primary);
        }

        .option-btn.selected {
            background-color: #e7f1ff;
            border-color: var(--primary);
            font-weight: 600;
        }

        .option-btn.correct {
            background-color: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724;
        }

        .option-btn.wrong {
            background-color: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24;
        }

        .feedback-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            display: none;
        }

        .feedback-box.show {
            display: block;
        }

        .feedback-box.correct {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .feedback-box.wrong {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* Bottom Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-top: 1px solid #eee;
            margin-top: auto;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .btn-prev, .btn-next { background-color: var(--primary); color: white; }
        .btn-review { background-color: var(--warning); color: #333; }
        .btn-clear { background-color: var(--gray); color: white; }
        .btn-submit { background-color: var(--secondary); color: white; }
        .btn-reset { background-color: var(--danger); color: white; }

        .btn:hover { opacity: 0.9; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }

        /* Question Sidebar (Palette) */
        .sidebar {
            width: 320px;
            background-color: #f8f9fa;
            border-left: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
            overflow-y: auto; /* Independent Smooth Scroll */
            height: 100%;
        }

        .sidebar-header {
            padding: 15px;
            background: #e9ecef;
            font-weight: bold;
            border-bottom: 1px solid #dee2e6;
        }

        .legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 10px 15px;
            font-size: 0.8rem;
            border-bottom: 1px solid #dee2e6;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: inline-block;
            text-align: center;
            line-height: 20px;
            color: white;
            font-weight: bold;
            font-size: 0.75rem;
        }

        .badge-unanswered { background-color: #6c757d; }
        .badge-answered { background-color: var(--secondary); }
        .badge-review { background-color: var(--warning); color: #333; }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            padding: 15px;
        }

        .palette-btn {
            aspect-ratio: 1;
            border: 1px solid #ccc;
            background-color: #fff;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .palette-btn.current { border: 2px solid var(--primary); }
        .palette-btn.answered { background-color: var(--secondary); color: white; border-color: var(--secondary); }
        .palette-btn.review { background-color: var(--warning); color: black; border-color: var(--warning); }

        /* Answer Key Section */
        .answer-key-section {
            margin-top: 30px;
            padding: 20px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .answer-key-section h3 {
            margin-bottom: 15px;
            color: var(--primary-dark);
        }

        .key-item {
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #ccc;
            font-size: 0.95rem;
        }

        /* Mobile Optimization */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: 200px;
                border-left: none;
                border-top: 2px solid #ccc;
            }
            .quiz-container {
                height: calc(100% - 200px);
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Karnataka PC & SSC CBT Exam Portal</h1>
        <div class="timer-box" id="timer">Time Left: 20:00</div>
    </header>

    <div class="main-container">
        <!-- Main Quiz View -->
        <div class="quiz-container">
            <div id="quiz-view">
                <span class="page-badge" id="page-badge">Page 1</span>
                <div class="question-title" id="question-text">Loading question...</div>
                
                <div class="options-container" id="options-box">
                    <!-- Options injected here -->
                </div>

                <div class="feedback-box" id="feedback-box"></div>
            </div>

            <!-- Score View (hidden initially) -->
            <div id="result-view" style="display: none;">
                <h2>ಪರೀಕ್ಷಾ ಫಲಿತಾಂಶ (Test Summary)</h2>
                <br>
                <p id="score-text" style="font-size: 1.2rem; font-weight: bold;"></p>
                <br>
                <div class="answer-key-section" id="answer-key-content">
                    <h3>ಉತ್ತರ ಸೂಚಿ ಮತ್ತು ವಿವರಣೆ (Answer Key & Explanations)</h3>
                    <!-- Explanations Injected Here -->
                </div>
            </div>

            <div class="controls">
                <div>
                    <button class="btn btn-prev" id="btn-prev" onclick="navigate(-1)">Previous</button>
                    <button class="btn btn-next" id="btn-next" onclick="navigate(1)">Next</button>
                    <button class="btn btn-review" id="btn-review" onclick="toggleReview()">Mark for Review</button>
                    <button class="btn btn-clear" onclick="clearOption()">Clear Response</button>
                </div>
                <div>
                    <button class="btn btn-submit" onclick="submitExam()">Submit Test</button>
                    <button class="btn btn-reset" onclick="resetExam()">Reset Quiz</button>
                </div>
            </div>
        </div>

        <!-- Right Side Question Palette -->
        <div class="sidebar">
            <div class="sidebar-header">Question Palette</div>
            <div class="legend">
                <div class="legend-item"><span class="badge badge-unanswered"></span> Unanswered</div>
                <div class="legend-item"><span class="badge badge-answered"></span> Answered</div>
                <div class="legend-item"><span class="badge badge-review"></span> Review</div>
            </div>
            <div class="palette-grid" id="palette-grid">
                <!-- Palette buttons dynamically created -->
            </div>
        </div>
    </div>

                options: ["ಕರ್ನಾಟಕ", "ತ್ರಿಪುರ", "ಕೇರಳ", "ತಮಿಳುನಾಡು"],
                ans: 1,
                exp: "ತ್ರಿಪುರದ 'ನೆಲ್ಲಿಪಿಲ' ಜಿಲ್ಲಾ ಪಂಚಾಯತಿಯು ದೇಶದ ಅತ್ಯುತ್ತಮ ಜಿಲ್ಲಾ ಪಂಚಾಯತಿ ಪ್ರಶಸ್ತಿ ಪಡೆದಿದೆ."
            }

        let currentIndex = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let reviewStatus = new Array(questions.length).fill(false);
        let timerInterval;

        function initQuiz() {
            renderPalette();
            loadQuestion(0);
            startTimer(20 * 60); // 20 minutes
        }

        function loadQuestion(index) {
            currentIndex = index;
            const q = questions[index];

            document.getElementById('page-badge').innerText = q.page;
            document.getElementById('question-text').innerText = `${index + 1}. ${q.q}`;
            
            const optionsBox = document.getElementById('options-box');
            optionsBox.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `option-btn ${userAnswers[index] === idx ? 'selected' : ''}`;
                btn.innerHTML = `<strong>${String.fromCharCode(65 + idx)}.</strong> ${opt}`;
                btn.onclick = () => selectOption(idx);
                optionsBox.appendChild(btn);
            });

            // Feedback Logic
            const feedbackBox = document.getElementById('feedback-box');
            if (userAnswers[index] !== null) {
                feedbackBox.classList.add('show');
                if (userAnswers[index] === q.ans) {
                    feedbackBox.className = "feedback-box show correct";
                    feedbackBox.innerText = "ಸರಿ ಉತ್ತರ! (Correct Answer)";
                } else {
                    feedbackBox.className = "feedback-box show wrong";
                    feedbackBox.innerText = `ತಪ್ಪು ಉತ್ತರ. ಸರಿ ಉತ್ತರ: ${String.fromCharCode(65 + q.ans)}. ${q.options[q.ans]}`;
                }
            } else {
                feedbackBox.className = "feedback-box";
                feedbackBox.innerText = "";
            }

            document.getElementById('btn-prev').disabled = index === 0;
            document.getElementById('btn-next').disabled = index === questions.length - 1;
            
            updatePalette();
        }

        function selectOption(optIndex) {
            userAnswers[currentIndex] = optIndex;
            loadQuestion(currentIndex);
        }

        function clearOption() {
            userAnswers[currentIndex] = null;
            loadQuestion(currentIndex);
        }

        function toggleReview() {
            reviewStatus[currentIndex] = !reviewStatus[currentIndex];
            updatePalette();
        }

        function navigate(direction) {
            const target = currentIndex + direction;
            if (target >= 0 && target < questions.length) {
                loadQuestion(target);
            }
        }

        function renderPalette() {
            const grid = document.getElementById('palette-grid');
            grid.innerHTML = '';
            questions.forEach((_, idx) => {
                const btn = document.createElement('button');
                btn.className = 'palette-btn';
                btn.innerText = idx + 1;
                btn.onclick = () => loadQuestion(idx);
                grid.appendChild(btn);
            });
            updatePalette();
        }

        function updatePalette() {
            const btns = document.querySelectorAll('.palette-btn');
            btns.forEach((btn, idx) => {
                btn.className = 'palette-btn';
                if (idx === currentIndex) btn.classList.add('current');
                if (reviewStatus[idx]) {
                    btn.classList.add('review');
                } else if (userAnswers[idx] !== null) {
                    btn.classList.add('answered');
                }
            });
        }

        function startTimer(seconds) {
            let remain = seconds;
            timerInterval = setInterval(() => {
                let m = Math.floor(remain / 60);
                let s = remain % 60;
                document.getElementById('timer').innerText = `Time Left: ${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
                if (remain <= 0) {
                    clearInterval(timerInterval);
                    submitExam();
                }
                remain--;
            }, 1000);
        }

        function submitExam() {
            clearInterval(timerInterval);
            let score = 0;
            questions.forEach((q, idx) => {
                if (userAnswers[idx] === q.ans) score++;
            });

            document.getElementById('quiz-view').style.display = 'none';
            document.getElementById('result-view').style.display = 'block';
            document.getElementById('score-text').innerText = `ನಿಮ್ಮ ಅಂಕಗಳು (Your Score): ${score} / ${questions.length}`;

            // Render Explanations Key
            const keyContent = document.getElementById('answer-key-content');
            keyContent.innerHTML = '<h3>ಉತ್ತರ ಸೂಚಿ ಮತ್ತು ವಿವರಣೆ (Answer Key & Explanations)</h3>';
            questions.forEach((q, idx) => {
                const div = document.createElement('div');
                div.className = 'key-item';
                div.innerHTML = `
                    <strong>Q${idx + 1} [${q.page}]:</strong> ${q.q}<br>
                    <strong>ಸರಿ ಉತ್ತರ:</strong> ${String.fromCharCode(65 + q.ans)}. ${q.options[q.ans]}<br>
                    <small style="color: #555;">💡 <em>${q.exp}</em></small>
                `;
                keyContent.appendChild(div);
            });
        }

        function resetExam() {
            userAnswers.fill(null);
            reviewStatus.fill(false);
            document.getElementById('quiz-view').style.display = 'block';
            document.getElementById('result-view').style.display = 'none';
            clearInterval(timerInterval);
            startTimer(20 * 60);
            loadQuestion(0);
        }

        window.onload = initQuiz;
    </script>
