    const btn = document.createElement('button');
    btn.className = `palette-btn ${index === currentIndex ? 'active' : ''}`;
    btn.innerText = index + 1;
    
    if (userAnswers[index] !== null) {
      if (userAnswers[index] === quizData[index].correct) {
        btn.classList.add('answered-correct');
      } else {
        btn.classList.add('answered-incorrect');
      }
    }
    
    btn.onclick = () => jumpToQuestion(index);
    palette.appendChild(btn);
  });
}

function loadQuestion(index) {
  const qData = quizData[index];
  document.getElementById('question-text').innerText = qData.q;
  
  const optionsContainer = document.getElementById('options-container');
  optionsContainer.innerHTML = '';
  
  const expContainer = document.getElementById('explanation-container');
  expContainer.innerHTML = '';

  const isAnswered = userAnswers[index] !== null;

  qData.options.forEach((opt, optIdx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerText = opt;

    if (isAnswered) {
      btn.disabled = true;
      if (optIdx === qData.correct) {
        btn.classList.add('show-correct');
      }
      if (userAnswers[index] === optIdx) {
        if (optIdx === qData.correct) {
          btn.classList.add('selected-correct');
        } else {
          btn.classList.add('selected-incorrect');
        }
      }
    } else {
      btn.onclick = () => selectOption(optIdx);
    }

    optionsContainer.appendChild(btn);
  });

  if (isAnswered) {
    const isCorrect = userAnswers[index] === qData.correct;
    expContainer.innerHTML = `
      <div class="explanation-box ${isCorrect ? 'correct' : ''}">
        <h4>${isCorrect ? 'ಸರಿಯಾದ ಉತ್ತರ!' : 'ತಪ್ಪು (Incorrect)'}</h4>
        <p><b>ಸರಿಯಾದ ಉತ್ತರ:</b> ${qData.options[qData.correct]}</p>
        <p style="margin-top:5px;"><b>ವಿವರಣೆ:</b> ${qData.exp}</p>
      </div>
    `;
  }

  document.getElementById('prev-btn').disabled = index === 0;
  document.getElementById('next-btn').disabled = index === quizData.length - 1;
  
  renderPalette();
  updateScore();
}

function selectOption(optionIndex) {
  userAnswers[currentIndex] = optionIndex;
  loadQuestion(currentIndex);
}

function jumpToQuestion(index) {
  currentIndex = index;
  loadQuestion(currentIndex);
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    loadQuestion(currentIndex);
  }
}

function nextQuestion() {
  if (currentIndex < quizData.length - 1) {
    currentIndex++;
    loadQuestion(currentIndex);
  }
}

function updateScore() {
  const score = userAnswers.reduce((acc, ans, idx) => {
    return ans === quizData[idx].correct ? acc + 1 : acc;
  }, 0);
  document.getElementById('score').innerText = score;
}

window.onload = initQuiz;
</script>

</body>
</html>
